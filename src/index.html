<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes comptes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/*@CSS*/
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Mes comptes</div>
    <div class="actions-top" role="toolbar" aria-label="Actions rapides">
      <button class="ico ciel" id="cloudBtn" data-act="cloud" data-tip="Sauvegarder : enregistre une copie de vos comptes dans un dossier de votre choix (Google Drive, iCloud…)."><i data-lucide="cloud-upload"></i><span class="sr">Sauvegarder dans mon dossier Cloud</span></button>
      <label class="ico menthe" id="importBtn" data-tip="Retrouver vos comptes à partir d’un fichier de sauvegarde."><i data-lucide="folder-down"></i><span class="sr" id="importTxt">Importer la sauvegarde</span><input type="file" id="restorefile2" accept=".json,application/json" hidden></label>
      <button class="ico alerte" id="warnBtn" data-act="cloud" data-tip="Vous n’avez encore fait aucune sauvegarde. Touchez ici pour en faire une : si vous perdez votre téléphone, vos comptes seront retrouvés."><i data-lucide="triangle-alert"></i><span class="sr">Aucune sauvegarde : sauvegarder maintenant</span></button>
      <button class="ico lavande" id="camBtn" data-act="camembert" data-tip="Voir mes dépenses en camembert : chaque part porte son montant."><i data-lucide="chart-pie"></i><span class="sr">Mes dépenses en camembert</span></button>
      <button class="ico sable" data-tab="aide" data-tip="Mode d’emploi : comment ajouter vos relevés, sauvegarder et vous y retrouver."><i data-lucide="circle-help"></i><span class="sr">Mode d’emploi</span></button>
    </div>
  </header>
  <p class="etat-top"><span class="status" id="status"></span> <span class="dern-sauv" id="lastbk"></span></p>
  <nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
  <div id="demoBar"></div>
  <main id="view"></main>
  <div id="bulle" role="tooltip"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
//@JS
</script>
</body>
</html>
