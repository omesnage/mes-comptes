<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes comptes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#FAF7F0; --surface:#FFFDF8; --ink:#1A1918; --muted:#857E72; --line:#E4DED1;
  --gold:#A8844A; --gold-soft:#F1E8D6; --alert:#9C4A3C;
  --serif:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans:"Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141312; --surface:#1A1917; --ink:#EDE8DE; --muted:#958D80; --line:#2C2A26;
    --gold:#C9A76C; --gold-soft:#2A2419; --alert:#D98A78;
  }
}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1A1917; --ink:#EDE8DE; --muted:#958D80; --line:#2C2A26;
  --gold:#C9A76C; --gold-soft:#2A2419; --alert:#D98A78;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:28px 22px 80px}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px}
.brand{font-family:var(--serif);font-style:italic;font-size:26px;letter-spacing:.01em}
.status{font-size:12px;color:var(--muted);text-align:right}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px 24px;border-bottom:1px solid var(--line);margin-bottom:40px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:8px 0 10px;font-size:14px;color:var(--muted);white-space:nowrap;border-bottom:1px solid transparent;margin-bottom:-1px;letter-spacing:.02em}
nav.tabs button[aria-current="true"]{color:var(--ink);border-color:var(--gold)}
.badge{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--bg);font-size:11px;font-weight:500;line-height:18px;text-align:center}

.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;margin:-18px 0 30px;background:var(--gold-soft);font-size:13px}
.demo-bar button{text-decoration:underline;text-underline-offset:3px}

/* Période */
.levels{display:flex;gap:20px;font-size:13px;color:var(--muted);margin-bottom:14px}
.levels button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
.period{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.period h2{margin:0;font-family:var(--serif);font-weight:400;font-size:24px;min-width:0}
.period h2::first-letter{text-transform:uppercase}
.arrow{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.arrow:hover{color:var(--ink);border-color:var(--gold)}
.arrow svg{width:16px;height:16px}

/* Chiffre héros */
.hero{padding-bottom:30px;border-bottom:1px solid var(--line);margin-bottom:30px}
.big{font-family:var(--serif);font-weight:400;font-size:clamp(56px,15vw,96px);line-height:1;letter-spacing:-.02em;font-variant-numeric:lining-nums}
.big .cts{font-size:.36em;letter-spacing:0;vertical-align:.95em;margin-left:4px;color:var(--muted)}
.hero-sub{margin-top:14px;font-size:14px;color:var(--muted)}
.hero-sub strong{font-weight:400;color:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:38px}
.trio div{padding:0 16px;border-left:1px solid var(--line)}
.trio div:first-child{padding-left:0;border-left:0}
.trio span{display:block;font-size:12px;color:var(--muted)}
.trio b{font-family:var(--serif);font-weight:400;font-size:21px}

h3.sec{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 16px}
.chart{margin-bottom:42px}
.split{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:34px;align-items:center;margin-bottom:46px}
.split svg{width:100%;height:auto;display:block}
.split svg circle[data-cat]{cursor:pointer;transition:stroke-width .2s}
.split svg circle[data-cat]:hover{stroke-width:15}
.legend button{display:grid;grid-template-columns:10px 1fr auto auto;gap:12px;align-items:baseline;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.legend button:last-child{border-bottom:0}
.legend i{width:8px;height:8px;border-radius:50%;display:block;align-self:center}
.legend .pc{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.legend .am{font-family:var(--serif);font-size:16px;min-width:64px;text-align:right}
@media (max-width:520px){.split{grid-template-columns:1fr;gap:22px}.split svg{max-width:230px;margin:0 auto}}
.chart svg{width:100%;height:auto;display:block;overflow:visible}

/* Catégories */
.cats{border-top:1px solid var(--line)}
.cat{border-bottom:1px solid var(--line)}
.cat-row{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:18px 0 16px}
.cat-row i,.cat-row svg{width:19px;height:19px;color:var(--gold)}
.cat-name{font-size:15px;font-weight:400}
.cat-meta{font-size:12px;color:var(--muted);margin-top:2px}
.cat-amt{font-family:var(--serif);font-size:19px;text-align:right;white-space:nowrap}
.cat-emoji{font-size:14px;margin-left:6px}
.meter{grid-column:2 / 4;height:1px;background:var(--line);position:relative;margin-top:4px}
.meter span{position:absolute;left:0;top:0;height:1px;background:var(--gold)}
.meter em{position:absolute;top:-3px;width:1px;height:7px;background:var(--muted)}
.cat-ops{padding:0 0 18px 42px}
.cat.pending .cat-row i,.cat.pending .cat-row svg{color:var(--muted)}

/* Opérations */
.op{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.op:last-child{border-bottom:0}
.op-date{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.op-m{font-weight:400}
.op-l{font-size:11.5px;color:var(--muted);word-break:break-word}
.op-x{font-size:11.5px;color:var(--gold);margin-top:2px}
.op-amt{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.op-amt.cr{color:var(--gold)}
.op-tools .link{white-space:nowrap}
.op-tools{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:4px}
select.quiet{background:transparent;border:0;border-bottom:1px solid var(--line);padding:3px 18px 3px 0;font-size:12.5px;color:var(--muted);max-width:220px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 7px) 55%,calc(100% - 3px) 55%;background-size:4px 4px;background-repeat:no-repeat;border-radius:0}
.link{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.search{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:10px;font-size:15px}
.search::placeholder{color:var(--muted)}
.count{font-size:12px;color:var(--muted);margin:0 0 18px}

/* À valider */
.lead{font-size:14px;color:var(--muted);max-width:60ch;margin:0 0 26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:1px solid var(--ink);font-size:13.5px;letter-spacing:.02em;border-radius:0}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.gold:hover{background:var(--gold);color:var(--bg)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:30px}
.q{display:grid;grid-template-columns:1fr auto;gap:10px 18px;padding:18px 0;border-bottom:1px solid var(--line)}
.q:first-child{border-top:1px solid var(--line)}
.q-m{font-weight:400;font-size:15px}
.q-sub{font-size:12px;color:var(--muted);word-break:break-word}
.q-hint{font-size:11.5px;color:var(--gold);margin-top:3px}
.q-act{display:flex;gap:14px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.q-act .link{color:var(--ink)}
.empty{padding:50px 0;text-align:center;color:var(--muted)}
.empty p{font-family:var(--serif);font-size:22px;color:var(--ink);margin:0 0 10px}

/* Règles */
.rule{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.budget{display:grid;grid-template-columns:28px 1fr 110px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.budget svg{width:17px;height:17px;color:var(--gold)}
.budget input{background:transparent;border:0;border-bottom:1px solid var(--line);text-align:right;padding:4px 0;width:100%;font-variant-numeric:tabular-nums}
.block{margin-bottom:48px}

/* Import */
.drop{display:block;border:1px solid var(--line);padding:46px 22px;text-align:center;cursor:pointer;background:var(--surface);margin-bottom:26px}
.drop.over{border-color:var(--gold)}
.drop p{font-family:var(--serif);font-size:22px;margin:0 0 6px}
.drop span{font-size:13px;color:var(--muted)}
.drop input{display:none}
.report{border-top:1px solid var(--line);padding:18px 0}
.report h4{margin:0 0 4px;font-weight:400;font-size:15px}
.report .count{margin-bottom:10px}
details{margin-top:10px;font-size:12.5px;color:var(--muted)}
details pre{white-space:pre-wrap;font-size:11px;max-height:260px;overflow:auto;background:var(--surface);padding:12px;border:1px solid var(--line)}
.choice{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;font-size:14px;margin:26px 0 8px}
.choice span{color:var(--muted);font-size:13px;width:100%}
.choice button{color:var(--muted)}
.choice button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 22px;padding:20px;border:1px solid var(--line);background:var(--surface);margin-bottom:16px}
.map h4{grid-column:1/-1;margin:0;font-weight:400;font-size:15px}
.map label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.map select.quiet{max-width:none;color:var(--ink);font-size:14px}
.ok{font-size:13px;color:var(--gold);margin:0 0 14px}
.retenir{border:1px solid var(--line);background:var(--surface);padding:6px 20px;margin:0 0 34px}
.retenir button{display:grid;grid-template-columns:22px 1fr 14px;gap:10px;align-items:baseline;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.retenir button:last-child{border-bottom:0}
.retenir .e{font-size:14px}
.retenir svg{width:14px;height:14px;color:var(--muted);align-self:center}
.kpi{font-family:var(--serif);font-size:clamp(44px,12vw,72px);line-height:1;margin:6px 0 10px}
.kpi small{font-size:.34em;color:var(--muted);font-family:var(--sans);margin-left:8px}
.gauge{height:2px;background:var(--line);position:relative;margin:18px 0 8px}
.gauge span{position:absolute;left:0;top:0;height:2px;background:var(--gold)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row .sub{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.row b{font-family:var(--serif);font-weight:400;font-size:18px;white-space:nowrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 26px;margin:6px 0 10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fields input{background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 0;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.defi{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.defi .n{font-size:15px;font-weight:400}
.defi .d{font-size:12.5px;color:var(--muted)}
.defi .st{font-size:12.5px;color:var(--gold)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:22px 14px}
.medal{text-align:center;font-size:12px;color:var(--muted);line-height:1.35}
.medal .disc{width:62px;height:62px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;border:1px solid var(--line);color:var(--line)}
.medal .disc svg{width:24px;height:24px}
.medal.on{color:var(--ink)}
.medal.on .disc{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--gold)}
.medal em{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-top:2px}
.wrapped-card{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;padding:24px;margin:0 0 38px;background:var(--ink);color:var(--bg)}
.wrapped-card .t{font-family:var(--serif);font-size:24px;font-style:italic}
.wrapped-card .s{font-size:13px;opacity:.7}
.wrapped-card svg{color:var(--gold);width:22px;height:22px;flex:none}
#review{position:fixed;inset:0;z-index:20;background:var(--ink);color:var(--bg);overflow-y:auto;scroll-snap-type:y mandatory;padding-top:env(safe-area-inset-top,0px)}
#review .slide{min-height:100vh;min-height:100dvh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:40px 30px;max-width:640px;margin:0 auto}
#review .lbl{font-size:14px;opacity:.65;margin-bottom:14px}
#review .v{font-family:var(--serif);font-size:clamp(52px,15vw,104px);line-height:1;color:var(--gold)}
#review .v.txt{font-size:clamp(34px,9vw,60px);color:var(--bg)}
#review .v.txt::first-letter{text-transform:uppercase}
#review .c{font-size:15px;opacity:.75;margin-top:18px;max-width:40ch}
#review .close{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:18px;color:var(--bg);opacity:.8;font-size:13px;text-decoration:underline;text-underline-offset:3px;z-index:21}
#review .hint{font-size:12px;opacity:.5;margin-top:40px}
.privacy{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--gold);background:var(--gold-soft);font-size:13.5px;line-height:1.5;margin:0 0 28px}
.privacy svg{width:18px;height:18px;color:var(--gold);flex:none;margin-top:1px}
.foot{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.foot svg{width:13px;height:13px;color:var(--gold)}
.acct{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:4px 0 10px}
.acct select.quiet{color:var(--ink);font-size:13px}
.levels{align-items:baseline;flex-wrap:wrap}
.levels .acct{margin:0 0 0 auto}
textarea.anon{width:100%;min-height:180px;font:11px/1.45 ui-monospace,Menlo,monospace;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:10px;margin:10px 0}
.steps{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.55}
.steps li{margin-bottom:8px;padding-left:4px}
.steps li::marker{color:var(--gold);font-family:var(--serif)}
.note{font-size:12.5px;color:var(--muted);max-width:62ch}
.danger{color:var(--alert)}
@media (max-width:520px){
  .wrap{padding:22px 18px 70px}
  .trio b{font-size:18px}
  .trio div{padding:0 10px}
  .q{grid-template-columns:1fr}
  .q-act{justify-content:flex-start}
  .cat-ops{padding-left:0}
}
@media (prefers-reduced-motion:no-preference){
  .hero .big{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}

/* Univers : vue d'ensemble, pro, perso */
.univ{display:flex;border:1px solid var(--line);margin:0 0 22px;width:max-content;max-width:100%}
.univ button{padding:9px 18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.univ button+button{border-left:1px solid var(--line)}
.univ button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.univ button:not([aria-pressed="true"]):hover{color:var(--ink)}
.ask{border:1px solid var(--gold);background:var(--gold-soft);padding:16px 18px;margin:0 0 26px}
.ask p{margin:0 0 12px;font-size:14.5px}
.ask p.note{margin:12px 0 0;font-size:12.5px}
.ask b{font-weight:400}
.ask-btns{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:7px 14px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.pill[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.pill:hover{border-color:var(--ink)}
.row.total{border-bottom:1px solid var(--ink)}
.row.total span{font-weight:400}
.row.total b{font-size:22px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:-12px 0 38px}
.duo-card{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);padding:18px 18px 14px}
.duo-card:hover{border-color:var(--gold)}
.duo-t{font-family:var(--serif);font-size:18px;margin-bottom:4px}
.duo-r{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.duo-r b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.duo-go{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;color:var(--gold)}
.duo-go svg{width:13px;height:13px}
.acct-card{border-bottom:1px solid var(--line);padding:16px 0 12px}
.acct-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:6px}
.acct-name{font-size:15px;font-weight:400}
.acct-head .link{margin-left:auto}
.fields select.quiet{max-width:none;color:var(--ink);font-size:15px;padding:6px 18px 6px 0}
.rule-tools{display:flex;gap:14px;align-items:baseline;font-size:12.5px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){
  .duo{grid-template-columns:1fr}
  .univ{width:100%}.univ button{flex:1;padding:9px 6px;letter-spacing:.08em}
  .rule{grid-template-columns:minmax(0,1fr) auto auto;gap:10px}
  .rule>span:first-child{overflow-wrap:anywhere}
  .rule select.quiet{max-width:150px}
  .rule-cat{grid-template-columns:1fr auto;gap:6px 12px}
  .rule-cat .rule-tools{grid-column:1/-1;grid-row:2;justify-content:flex-start;padding-left:29px}
}

/* Alertes : critique (rouge), attention (ambre), bonne nouvelle (doré) */
:root{--alert-soft:#F7ECE8;--alert-line:#E3C4BA;--amber:#9A6A1F;--amber-soft:#F6EEDD;--amber-line:#E6D2A8;--good-soft:#F3ECDD;--good-line:#E0D0AE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--alert-soft:#2A1C18;--alert-line:#5A3329;--amber:#D8A95E;--amber-soft:#28221A;--amber-line:#5A4526;--good-soft:#231F17;--good-line:#4E4128}}
:root[data-theme="dark"]{--alert-soft:#2A1C18;--alert-line:#5A3329;--amber:#D8A95E;--amber-soft:#28221A;--amber-line:#5A4526;--good-soft:#231F17;--good-line:#4E4128}
.alerte{display:grid;grid-template-columns:20px 1fr;gap:14px;padding:16px 20px 14px;border:1px solid;border-left-width:3px;margin:0 0 10px}
.alerte>svg{width:18px;height:18px;margin-top:3px}
.alerte p{margin:0 0 6px}
.alerte .t{font-size:16px;line-height:1.45}
.alerte .t b,.alerte .d b{font-weight:500}
.alerte .d{font-size:13.5px;line-height:1.5;color:var(--muted)}
.alerte.crit{background:var(--alert-soft);border-color:var(--alert-line);border-left-color:var(--alert)}
.alerte.crit>svg,.alerte.crit .t b{color:var(--alert)}
.alerte.warn{background:var(--amber-soft);border-color:var(--amber-line);border-left-color:var(--amber)}
.alerte.warn>svg,.alerte.warn .t b{color:var(--amber)}
.alerte.good{background:var(--good-soft);border-color:var(--good-line);border-left-color:var(--gold)}
.alerte.good>svg,.alerte.good .t b{color:var(--gold)}
.pistes{margin:10px 0 4px;padding-left:18px;font-size:13.5px;line-height:1.5}
.pistes li{margin-bottom:4px}
.pistes li::marker{color:var(--alert)}
.alerte .acts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.alerte .acts button{font-size:12.5px;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.calc{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.calc b{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--gold);line-height:1.3}

/* Lecture d'un relevé : essai et résultat complet */
.test-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:-10px 0 22px}
.report.test{border:1px dashed var(--gold);padding:16px 18px;margin-bottom:18px}
.test-flag{margin:0 0 6px;font-size:12.5px;color:var(--gold);letter-spacing:.02em}
.lecture{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 12px}
.lecture div{display:flex;flex-direction:column;gap:2px;min-width:0}
.lecture span{font-size:11.5px;color:var(--muted)}
.lecture b{font-weight:400;font-size:14.5px;overflow-wrap:anywhere}
.lecture em{font-style:normal;font-size:11.5px;color:var(--muted)}
.verif{font-size:13px;margin:0 0 12px;color:var(--muted)}
.verif.ok{color:var(--gold)}
.verif.ko{color:var(--alert)}
.apercu{margin-top:12px}
.apercu summary{cursor:pointer;color:var(--ink);font-size:13px}
.pv{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink)}
.pv span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.pv span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.pv .cr{color:var(--gold)}
.pv.dup{opacity:.6}
.pv em{font-style:normal;font-size:11px;color:var(--muted);margin-left:6px}
@media (max-width:520px){.lecture{grid-template-columns:1fr 1fr}}

.alertes{margin:0 0 32px}
.alerte .t{font-size:15px}
.alerte .acts .mask{color:var(--muted);margin-left:auto}
.alertes details.plus summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 0 10px;text-decoration:underline;text-underline-offset:3px}
.alertes details.plus[open] summary{color:var(--ink)}
nav.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--alert);margin-left:6px;vertical-align:2px}
.m-crit{color:var(--alert)}.m-warn{color:var(--amber)}.m-good{color:var(--gold)}
@media (max-width:520px){.alerte{padding:14px 14px 12px;gap:10px}.alerte .acts .mask{margin-left:0}}

/* Défis, score, niveaux, médailles */
.sous{font-weight:400;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 6px}
.kick{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.score-top{display:grid;grid-template-columns:180px 1fr;gap:26px;align-items:center;margin-bottom:6px}
.jauge{width:180px;height:auto}
.score-mot{font-family:var(--serif);font-size:22px;margin:0 0 6px}
.niveau{border:1px solid var(--line);background:var(--surface);padding:22px 22px 14px}
.niv-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:12px}
.niv-nom{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 4px}
.niv-xp{text-align:right}.niv-xp b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;color:var(--gold)}.niv-xp span{font-size:12px;color:var(--muted)}
.xp-detail{margin-top:6px}
.serie-card{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}
.serie-n{font-family:var(--serif);font-size:56px;line-height:1;color:var(--gold)}
.serie-card .t{margin:0 0 4px;font-size:15px}
.propose{border:1px solid var(--gold);background:var(--gold-soft);padding:20px 22px}
.propose .t{font-family:var(--serif);font-size:20px;line-height:1.35;margin:0 0 16px}
.chip{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 7px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.defi-card{display:grid;grid-template-columns:60px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.defi-card .ring{color:var(--gold)}.defi-card.crit .ring{color:var(--alert)}.defi-card.wait .ring{color:var(--muted)}
.defi-card .n{font-size:15px;font-weight:400}.defi-card .d{font-size:13px;margin-top:2px}
.defi-card .meta{font-size:12px;color:var(--muted);margin-top:3px}
.defi-card.good .meta{color:var(--gold)}.defi-card.crit .meta{color:var(--alert)}
.medal .disc{position:relative}
.medal .medal-ring{position:absolute;inset:-1px;color:var(--gold)}
.medal.t1 .disc{border-color:#A8703F;color:#A8703F;background:transparent;box-shadow:none}
.medal.t2 .disc{border-color:#8E959C;color:#8E959C;background:transparent;box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px #8E959C}
.medal.t3 .disc{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--gold)}
.medal .prog{font-size:10.5px;margin-top:4px;line-height:1.35}
#celebre{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 72%,transparent);padding:24px}
.celebre-in{background:var(--bg);max-width:420px;width:100%;text-align:center;padding:40px 30px 30px;border:1px solid var(--gold)}
.celebre-in h2{font-family:var(--serif);font-weight:400;font-size:40px;margin:0 0 10px}
.celebre-in .desc{font-size:15px;margin:0 0 12px}
.celebre-in .note{margin:0 auto 22px}
.anneau{width:96px;height:96px;margin:0 auto 18px;display:block}
.anneau circle{fill:none;stroke-width:2}
.anneau .fond{stroke:var(--line)}
.anneau .trace{stroke:var(--gold);stroke-dasharray:327;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .anneau .trace{animation:trace 1.6s cubic-bezier(.6,.1,.2,1) both}
  .celebre-in .kick,.celebre-in h2,.celebre-in .desc,.celebre-in .note,.celebre-in .btn{animation:monte .8s cubic-bezier(.2,.7,.2,1) both}
  .celebre-in h2{animation-delay:.5s}.celebre-in .desc{animation-delay:.75s}.celebre-in .note,.celebre-in .btn{animation-delay:1s}
  .celebre-in{animation:ouvre .5s ease both}
  @keyframes trace{from{stroke-dashoffset:327}to{stroke-dashoffset:0}}
  @keyframes monte{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes ouvre{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
}
@media (max-width:520px){.score-top{grid-template-columns:1fr;justify-items:center;text-align:center}.defi-card{grid-template-columns:48px 1fr}.defi-card .ring{width:48px;height:48px}.defi-card>.link,.defi-card>span:last-child{grid-column:2}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Mes comptes</div>
    <div class="status" id="status"></div>
  </header>
  <div id="univ"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="demoBar"></div>
  <main id="view"></main>
</div>

<script>
/* ============ Données de base ============ */
const SCHEMA=3;
const SET0={epargne:0,taux:0,heures:160,netVise:2000,objectif:6,assiette:'ca'};
/* univers : 'perso', 'pro' ou 'auto' (suit le type du compte) */
const CATS0=[
 ['courses','Courses alimentaires','shopping-basket','expense','perso'],
 ['resto','Restaurants & cafés','utensils','expense','perso'],
 ['transport','Transport & carburant','car','expense','auto'],
 ['logement','Logement & énergie','house','expense','perso'],
 ['sante','Santé','heart-pulse','expense','perso'],
 ['abonnements','Abonnements & téléphonie','smartphone','expense','auto'],
 ['loisirs','Loisirs & culture','ticket','expense','perso'],
 ['shopping','Shopping','shopping-bag','expense','perso'],
 ['frais','Frais bancaires','landmark','expense','auto'],
 ['pret','Remboursement de prêt','key-round','expense','auto'],
 ['logiciels','Logiciels & outils','app-window','expense','pro'],
 ['materiel','Matériel & fournitures','monitor','expense','pro'],
 ['deplacements','Déplacements professionnels','plane','expense','pro'],
 ['soustraitance','Sous-traitance','handshake','expense','pro'],
 ['comptable','Comptable & juridique','scale','expense','pro'],
 ['cotisations','Cotisations sociales','shield-check','expense','pro'],
 ['impots','Impôts sur l’activité','receipt','expense','pro'],
 ['pro','Autres frais professionnels','briefcase','expense','pro'],
 ['remb','Remboursements','rotate-ccw','expense','auto'],
 ['rentrees','Rentrées d’argent','hand-coins','income','perso'],
 ['revenus','Revenus','arrow-down-left','income','auto'],
 ['remu','Rémunération (pro vers perso)','arrow-left-right','remu','auto'],
 ['interne','Virements internes','repeat','transfer','auto'],
 ['divers','Divers','circle-dashed','expense','auto']
].map(([id,name,icon,type,univers])=>({id,name,icon,type,univers,budget:0,fixed:false}));
/* Rubriques qui correspondent au paiement de la provision (cotisations, impôts) */
const PROV_CATS=new Set(['cotisations','impots']);
const typeOf=id=>(S.categories.find(c=>c.id===id)||{}).type||'expense';
const LOAN_RE=/\b(ECH(EANCE)?|REMB(OURSEMENT)?|PRLV|PRELEVEMENT)?\s*(SEPA\s*)?(DE\s*)?(PRET|CREDIT IMMO|PRET IMMO)\b|\b(COFIDIS|CETELEM|SOFINCO|FRANFINANCE|FLOA|ONEY)\b/;
CATS0.forEach(c=>{if(['logement','pret','abonnements','frais'].includes(c.id))c.fixed=true});
function autoCatOf(label){const b=brandOf(label);if(b&&b[2])return b[2];if(LOAN_RE.test(norm(label)))return 'pret';return null}

/* Mots-clés toujours professionnels, quel que soit le compte */
const KW_PRO=[
 [/URSSAF|CIPAV|CARMF|CARPIMKO|CAVEC|CARCDSF|CAVP|\bSSI\b|SECURITE SOCIALE DES INDEPENDANTS/,'cotisations'],
 [/DGFIP|IMPOTS?\b|TRESOR PUBLIC|FINANCES PUBLIQUES|\bCFE\b/,'impots'],
 [/EXPERT COMPTABLE|COMPTABILITE|PENNYLANE|\bINDY\b|TIIME|LEGALSTART|LEGALPLACE|INFOGREFFE|GREFFE/,'comptable']
];
/* Mots-clés professionnels seulement sur un compte pro */
const KW_PROACC=[
 [/OVH|ADOBE|CANVA|NOTION|SLACK|GOOGLE WORKSPACE|GSUITE|MICROSOFT|SQUARESPACE|\bWIX\b|SHOPIFY|DROPBOX|ANTHROPIC|CLAUDE|OPENAI|FIGMA|\bZOOM\b|CALENDLY|MAILCHIMP|BREVO|GANDI|IONOS/,'logiciels'],
 [/LDLC|MATERIEL NET|BOULANGER|BUREAU VALLEE|OFFICE DEPOT|APPLE STORE|RAJA|MANUTAN/,'materiel'],
 [/SNCF|OUIGO|AIR FRANCE|EASYJET|RYANAIR|HOTEL|BOOKING|AIRBNB|IBIS|NOVOTEL/,'deplacements']
];
const KW=[
 [/TOTALENERGIES|EDF|ENGIE|VEOLIA|SAUR|LOYER|SYNDIC|FONCIA|NEXITY|GRDF|EAU DE/,'logement'],
 [/CARREFOUR|LECLERC|INTERMARCHE|LIDL|AUCHAN|SUPER U|HYPER U|MONOPRIX|FRANPRIX|BIOCOOP|CASINO|ALDI|NETTO|SPAR|PICARD|GRAND FRAIS|PRIMEUR|BOUCHERIE|FROMAGER|NATURALIA|LA VIE CLAIRE/,'courses'],
 [/RESTAU|BRASSERIE|CAFE|BISTRO|BOULANGERIE|PATISS|MCDO|MC DONALD|BURGER|KFC|SUSHI|PIZZ|CREPERIE|UBER EATS|DELIVEROO|STARBUCKS|TRAITEUR/,'resto'],
 [/TOTAL|ESSO|SHELL|AVIA|STATION|SNCF|OUIGO|RATP|UBER|BOLT|BLABLACAR|AUTOROUTE|VINCI|APRR|SANEF|ASF|PARKING|INDIGO|AIR FRANCE|EASYJET|RYANAIR|PEAGE|LIME/,'transport'],
 [/PHARMA|DOCTEUR|MEDECIN|DENTISTE|KINE|OPTIC|LABO|HOPITAL|CLINIQUE|CPAM|MUTUELLE|AMELI|DOCTOLIB/,'sante'],
 [/FREE MOBILE|FREE|ORANGE|SFR|BOUYGUES|SOSH|NETFLIX|SPOTIFY|DEEZER|DISNEY|CANAL|APPLE|ITUNES|GOOGLE|ADOBE|MICROSOFT|AMAZON PRIME|PRIME VIDEO|ANTHROPIC|CLAUDE|OPENAI|SQUARESPACE|DROPBOX/,'abonnements'],
 [/CINEMA|PATHE|GAUMONT|UGC|THEATRE|MUSEE|CONCERT|LIBRAIRIE|CULTURA|STEAM|PLAYSTATION|BILLET/,'loisirs'],
 [/AMAZON|FNAC|DARTY|DECATHLON|IKEA|ZARA|UNIQLO|SEPHORA|LEROY MERLIN|CASTORAMA|BRICO|ACTION|GIFI|ETSY|VINTED|ZALANDO|H&M/,'shopping'],
 [/FRAIS|COTIS|COMMISSION|AGIOS|INTERETS DEB/,'frais'],
 [/SALAIRE|PAIE|HONORAIRES|CAF|FRANCE TRAVAIL|POLE EMPLOI/,'revenus'],
 [/RETRAIT ESPECES/,'divers']
];

const BRANDS=[
 [/\bCARREFOUR\b/,'CARREFOUR','courses'],
 [/\b(SUPER U|HYPER U|U EXPRESS|MARCHE U|SYSTEME U|MAGASINS U)\b/,'SUPER U','courses'],
 [/\bLECLERC\b/,'LECLERC','courses'],
 [/\bINTERMARCHE\b/,'INTERMARCHE','courses'],
 [/\bLIDL\b/,'LIDL','courses'],
 [/\bAUCHAN\b/,'AUCHAN','courses'],
 [/\bMONOPRIX\b/,'MONOPRIX','courses'],
 [/\bFRANPRIX\b/,'FRANPRIX','courses'],
 [/\bBIOCOOP\b/,'BIOCOOP','courses'],
 [/\bALDI\b/,'ALDI','courses'],
 [/\bNETTO\b/,'NETTO','courses'],
 [/\bPICARD\b/,'PICARD','courses'],
 [/\bGRAND FRAIS\b/,'GRAND FRAIS','courses'],
 [/\b(GEANT CASINO|CASINO SHOP|PETIT CASINO|SUPERMARCHE CASINO)\b/,'CASINO','courses'],
 [/\bSPAR\b/,'SPAR','courses'],
 [/\bNATURALIA\b/,'NATURALIA','courses'],
 [/\bLA VIE CLAIRE\b/,'LA VIE CLAIRE','courses'],
 [/\bCOCCINELLE\b/,'COCCINELLE','courses'],
 [/\b(AMAZON|AMZN)\b/,'AMAZON',null],
 [/\bZALANDO\b/,'ZALANDO',null],[/\bVINTED\b/,'VINTED',null],[/\bSHEIN\b/,'SHEIN',null],[/\bTEMU\b/,'TEMU',null],
 [/\bCDISCOUNT\b/,'CDISCOUNT',null],[/\bFNAC\b/,'FNAC',null],[/\bDARTY\b/,'DARTY',null],[/\bDECATHLON\b/,'DECATHLON',null],
 [/\bIKEA\b/,'IKEA',null],[/\bETSY\b/,'ETSY',null],[/\bALIEXPRESS\b/,'ALIEXPRESS',null],[/\bASOS\b/,'ASOS',null],
 [/\bLA REDOUTE\b/,'LA REDOUTE',null],[/\bVEEPEE\b/,'VEEPEE',null],[/\bBACK ?MARKET\b/,'BACK MARKET',null],
 [/\bLEBONCOIN\b/,'LEBONCOIN',null],[/\bSEPHORA\b/,'SEPHORA',null],[/\bAPPLE\b/,'APPLE',null],
 [/\bSNCF\b/,'SNCF',null]
];
function brandOf(label){const s=norm(label);return BRANDS.find(b=>b[0].test(s))||null}

let S=blank(), demo=false, backup=null;
let view='synthese', P=null, openCat=null, q='';
let UNIV='all', OPACC='';
const reports=[];
const HAS_CLAUDE=!!(window.claude&&window.claude.use);

function blank(){return{schemaVersion:SCHEMA,game:{seenLevel:null,backups:0,cagnotte:{nom:'',montant:0}},accounts:[],categories:CATS0.map(c=>({...c})),rules:{},sugg:{},ops:[],incomeSource:'bank',settings:{...SET0},challenges:[],readers:[]}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const fmt0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur=n=>fmt.format(n), eur0=n=>fmt0.format(n);
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const catById=id=>S.categories.find(c=>c.id===id);
const newId=p=>p+Math.random().toString(36).slice(2,10);

/* ============ Comptes ============ */
const ACCT_TYPES={perso:'Personnel',pro:'Professionnel',mixte:'Pro et perso mélangés'};
const acctById=id=>S.accounts.find(a=>a.id===id);
const acctOf=o=>o.acct||'';
const acctName=id=>(acctById(id)||{}).name||'Compte principal';
const acctType=o=>(acctById(o.acct)||{}).type||'perso';
function addAccount(x){const a={id:newId('a_'),name:x.name||'Compte principal',bank:x.bank||'',no:x.no||'',type:x.type||'perso',confirmed:!!x.confirmed,solde:null,soldeDate:''};S.accounts.push(a);stateDirty=true;return a}
const PRO_HINT=/\b(SASU?|SARL|EURL|SELARL|SELAS|SCP|SCM|ENTREPRISE INDIVIDUELLE|MICRO[- ]?ENTREPRENEUR|MICRO[- ]?ENTREPRISE|AUTO[- ]?ENTREPRENEUR|COMPTE PROFESSIONNEL|COMPTE PRO|CPTE PRO|CONVENTION PRO|OFFRE PRO|ESPACE PRO|EI)\b/;
function guessType(bank,headerText,name){
  if(['Qonto','Shine'].includes(bank)) return 'pro';
  if(PRO_HINT.test(norm(headerText||''))) return 'pro';
  if(/\bPRO\b|PROFESSIONNEL/.test(norm(name||''))) return 'pro';
  return 'perso';
}
/* Univers d'une opération : la rubrique décide si elle est marquée pro ou perso, sinon le type du compte.
   Sur un compte mélangé, une rentrée non marquée est pro (encaissement de l’activité), une dépense est perso. */
function univOf(o,c){
  if(o.src==='rev') return 'pro';
  const k=c&&c!=='_pending'?catById(c):null;
  if(k&&(k.univers==='pro'||k.univers==='perso')) return k.univers;
  const t=acctType(o);
  if(t==='mixte') return o.amount>0&&k&&k.type==='income'?'pro':'perso';
  return t==='pro'?'pro':'perso';
}
const hasPro=()=>S.accounts.some(a=>a.type==='pro');

let LINK={}, LINKED={}, BYID={}, INTERNAL={}, BYMONTH={};
function catOf(o){
  if(o.cat) return o.cat;
  if(INTERNAL[o.id]) return 'interne';
  if(o.amount>0&&LINK[o.id]){const p=BYID[LINK[o.id]];const c=p&&(p.cat||S.rules[p.merchant+'|-']||S.rules[p.merchant]);if(c)return c}
  const dir=S.rules[o.merchant+(o.amount>0?'|+':'|-')]; if(dir) return dir;
  const r=S.rules[o.merchant]; if(!r) return null;
  if(o.amount<0&&typeOf(r)==='income') return null;
  return r;
}
const REFUND_RE=/\b(REMBOURSEMENT|REMBT|REMB|RBT|AVOIR|ANNULATION|ANNUL|RETOUR|REFUND)\b/;
const ruleName=k=>k.endsWith('|-')?k.slice(0,-2)+' (dépenses)':k.endsWith('|+')?k.slice(0,-2)+' (rentrées)':k;
const dfmt=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(2,4);
function detectInternal(){
  INTERNAL={};
  const TR=/\b(VIR|VIREMENT|VIRT|TRANSFERT|TRANSFER|VERSEMENT)\b/;
  const cand=S.ops.filter(o=>o.src!=='rev'&&!o.cat&&TR.test(norm(o.label)));
  if(new Set(cand.map(acctOf)).size<2) return;
  const cr=cand.filter(o=>o.amount>0);
  for(const d of cand.filter(o=>o.amount<0)){
    const t=new Date(d.date);
    const m=cr.find(c=>!INTERNAL[c.id]&&acctOf(c)!==acctOf(d)&&Math.abs(c.amount+d.amount)<0.005&&Math.abs(new Date(c.date)-t)<=4*864e5);
    if(m){INTERNAL[d.id]=m.id;INTERNAL[m.id]=d.id}
  }
}
/* Sens d'un virement interne : +1 si c'est une rémunération (pro vers perso), −1 pour un apport (perso vers pro), 0 sinon */
function remuDir(debit,credit){
  const a=acctType(debit), b=acctType(credit);

function relink(){
  detectInternal();
  LINK={};LINKED={};BYID={};BYMONTH={};
  const debits={};
  for(const o of S.ops){BYID[o.id]=o; (BYMONTH[o.date.slice(0,7)]||(BYMONTH[o.date.slice(0,7)]=[])).push(o); if(o.src!=='rev'&&o.amount<0)(debits[o.merchant]||(debits[o.merchant]=[])).push(o)}
  const credits=S.ops.filter(o=>o.src!=='rev'&&o.amount>0&&debits[o.merchant]).sort((a,b)=>a.date<b.date?-1:1);
  for(const r of credits){
    const rc=r.cat||S.rules[r.merchant]; if(rc&&['income','transfer','remu'].includes(typeOf(rc))) continue;
    const rt=new Date(r.date);
    const cand=debits[r.merchant].filter(p=>!LINKED[p.id]&&p.date<=r.date&&(rt-new Date(p.date))<=120*864e5&&-p.amount>=r.amount-0.01);
    if(!cand.length) continue;

    cand.sort((x,y)=>score(x)-score(y));

  }
}
function isRefund(o){

  if(LINK[o.id]) return true;
  const c=catOf(o); if(c&&['income','transfer','remu'].includes(typeOf(c))) return false;
  return (c&&c!=='_pending')||REFUND_RE.test(norm(o.label));
}

function opExtra(o){

    const [d,c]=o.amount<0?[o,x]:[x,o];const r=remuDir(d,c);

function norm(s){return s.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function merchantOf(label){
  let s=norm(label);

  const br=BRANDS.find(b=>b[0].test(s)); if(br) return br[1];
  if(/\b(ECH(EANCE)?|REMB(OURSEMENT)?)\s+(DE\s+)?PRET\b/.test(s)){const ln=s.match(/PRET\D*(\d{4,})/);return 'ECHEANCE PRET'+(ln?' '+ln[1].slice(-4):'')}

  s=s.replace(/\b(REMBOURSEMENT|REMBT|REMB|RBT|AVOIR|ANNULATION|ANNUL|RETOUR|REFUND|PAYPAL)\b/g,' ');
  const cut=s.search(/\b(MOTIF|REF|REFERENCE|LIBELLE|RUM|ICS|FACTURE|FACT|ECHEANCE|NUM|COMMANDE|CDE)\b/);
  if(cut>0&&/[A-Z]{2}/.test(s.slice(0,cut).replace(/[^A-Z ]/g,''))) s=s.slice(0,cut);
  s=s.replace(/\b(JANVIER|FEVRIER|MARS|AVRIL|MAI|JUIN|JUILLET|AOUT|SEPTEMBRE|OCTOBRE|NOVEMBRE|DECEMBRE|JANV|FEV|AVR|JUIL|SEPT|OCT|NOV|DEC)\b/g,' ');
  s=s.replace(/\d{2}[\/.]\d{2}([\/.]\d{2,4})?/g,' ').replace(/[^A-Z0-9& '.-]/g,' ');
  const stop=new Set(['SA','SAS','SARL','FR','EUR','REF','MOTIF','ID','ICS','RUM','X','COMMERCE','ELECTRONIQUE','WWW','COM','EUROPE','ET','CIE','SCA','SE','LTD','GMBH','PP']);

}

function kwSuggest(m,label,atype,amount){
  const t=norm(m+' '+label);
  if(atype==='pro'&&amount<0&&/\b(VIR|VIREMENT)\b/.test(t)&&/\b(PERSO|PERSONNEL|REMUNERATION|PRELEVEMENT EXPLOITANT)\b/.test(t)) return 'remu';
  for(const [re,c] of KW_PRO) if(re.test(t)) return c;
  if(atype==='pro') for(const [re,c] of KW_PROACC) if(re.test(t)) return c;

function parseDateAny(s,Y){

function compileReader(r){

  if(!r.nom||!r.ligne) throw new Error('Il manque « nom » ou « ligne ».');

    const date=parseDateAny(G.date,Y); if(!date) continue;
    let amount=NaN;
    if(G.debit&&G.debit.trim()) amount=-Math.abs(toNum(G.debit));
    else if(G.credit&&G.credit.trim()) amount=Math.abs(toNum(G.credit));

function parseCSV(text){

  if(!rowsRaw.length) throw new Error('Ce fichier est vide. Téléchargez à nouveau votre relevé depuis le site de votre banque.');
  const sep=(rowsRaw[0].split(';').length>=rowsRaw[0].split(',').length)?';':',';
  const split=l=>{const out=[];let cur='',inq=false;for(const ch of l){if(ch==='"'){inq=!inq;continue}if(ch===sep&&!inq){out.push(cur);cur='';continue}cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  const rows=rowsRaw.map(split);
  let h=rows.findIndex(r=>r.some(c=>/date/i.test(c)));
  if(h<0) throw new Error('Ce fichier ne ressemble pas à un relevé : aucune colonne de dates n’a été trouvée. Téléchargez plutôt le relevé au format PDF depuis le site de votre banque.');
  const H=rows[h].map(c=>norm(c));
  const iD=H.findIndex(c=>c.includes('DATE'));
  const iL=H.findIndex(c=>/LIBELLE|LABEL|DESCRIPTION|INTITULE|OPERATION/.test(c)&&!c.includes('DATE'));
  const iM=H.findIndex(c=>/MONTANT|AMOUNT/.test(c));
  const iDe=H.findIndex(c=>c.includes('DEBIT')), iCr=H.findIndex(c=>c.includes('CREDIT'));
  const ops=[];
  for(const r of rows.slice(h+1)){
    const d=r[iD]||''; let date=null, mm;
    if(mm=d.match(/^(\d{2})[\/.-](\d{2})[\/.-](\d{2,4})/)) date=`${mm[3].length===2?'20'+mm[3]:mm[3]}-${mm[2]}-${mm[1]}`;
    else if(mm=d.match(/^(\d{4})-(\d{2})-(\d{2})/)) date=`${mm[1]}-${mm[2]}-${mm[3]}`;
    if(!date) continue;
    const num=s=>{if(!s)return 0;const t=s.replace(/[€\s\u00a0]/g,'');return parseFloat(t.includes(',')?t.replace(/\./g,'').replace(',','.'):t)||0};
    let amount=iM>=0?num(r[iM]):(num(r[iCr])-Math.abs(num(r[iDe])));
    if(!amount) continue;
    ops.push({date,label:(r[iL>=0?iL:1]||'').replace(/\s+/g,' '),amount:+amount.toFixed(2)});
  }
  return {ops,raw:rowsRaw.slice(0,30).join('\n'),full:rowsRaw.slice(0,h+1).join('\n'),header:rowsRaw.slice(0,h).join('\n')};
}

/* Retrouve le compte d'un relevé (par numéro, sinon par banque) ou en crée un nouveau, avec un type supposé.
   En mode essai (dry), rien n'est créé ni modifié : on renvoie seulement ce qui se passerait. */
function resolveAccount(res,fileName,dry){
  const text=res.full||res.raw||'';
  const bank=detectBank(text)||'', no=detectAccountNo(text);
  let a=no&&S.accounts.find(x=>x.no===no);
  if(!a&&bank){const same=S.accounts.filter(x=>x.bank===bank);
    const free=same.filter(x=>!x.no);
    if(no&&free.length===1){a=free[0];if(!dry){a.no=no;stateDirty=true}}
    else if(!no&&same.length===1) a=same[0];}
  if(!a&&!bank&&!no&&S.accounts.length===1) a=S.accounts[0];
  if(a) return {a,isNew:false,bank,no};
  let name=bank||fileName.replace(/\.[a-z]+$/i,'').replace(/[_-]+/g,' ').trim().slice(0,30)||'Compte principal';
  if(S.accounts.some(x=>x.name===name)) name+=no?' ····'+no.slice(-4):' ('+(S.accounts.filter(x=>x.name.startsWith(name)).length+1)+')';
  const x={name,bank,no,type:guessType(bank,res.header||text.slice(0,1500),name)};
  return {a:dry?x:addAccount(x),isNew:true,bank,no};
}

function analyse(res,f,dry,rep){

/* ============ Périodes ============ */
function defaultPeriod(){
  const d=S.ops.length?S.ops.reduce((a,o)=>o.date>a?o.date:a,'0'):new Date().toISOString().slice(0,10);
  return {lvl:'M',y:+d.slice(0,4),m:+d.slice(5,7)};

const pad=n=>String(n).padStart(2,'0');
function bounds(p){
  if(p.lvl==='Y') return [`${p.y}-01`,`${p.y}-12`,12];
  if(p.lvl==='Q'){const q=Math.ceil(p.m/3),s=(q-1)*3+1;return [`${p.y}-${pad(s)}`,`${p.y}-${pad(s+2)}`,3]}
  return [`${p.y}-${pad(p.m)}`,`${p.y}-${pad(p.m)}`,1];
}
function shift(p,d){
  const n={...p};
  if(p.lvl==='Y') n.y+=d;
  else{const step=p.lvl==='Q'?3:1;let t=p.y*12+(p.m-1)+d*step;n.y=Math.floor(t/12);n.m=t%12+1}
  return n;
}
function plabel(p){
  if(p.lvl==='Y') return String(p.y);
  if(p.lvl==='Q'){const q=Math.ceil(p.m/3);return `${q===1?'1er':q+'e'} trimestre ${p.y}`}
  return `${MOIS[p.m-1]} ${p.y}`;
}
function prevLabel(p){
  const r=shift(p,-1);
  if(p.lvl==='M') return 'à '+MOIS[r.m-1];
  if(p.lvl==='Q') return 'au trimestre précédent';
  return 'à '+r.y;
}
let AGG={}, RAW={};
function monthKeys(a,b){const out=[];let y=+a.slice(0,4),m=+a.slice(5,7);const by=+b.slice(0,4),bm=+b.slice(5,7);while(y<by||(y===by&&m<=bm)){out.push(y+'-'+pad(m));if(++m>12){m=1;y++}}return out}
/* Calcul de base d'une période : un seau par univers (pro, perso) et la rémunération pro → perso */
function aggRaw(p){
  const ck=p.lvl+p.y+'-'+p.m+(p.lvl==='Q'?Math.ceil(p.m/3):''); if(RAW[ck]) return RAW[ck];
  const [a,b,months]=bounds(p); const fileInc=S.incomeSource==='file';
  const mk=()=>({by:{},inc:{},income:0,net:0,fixed:0,any:false});
  const R={pro:mk(),perso:mk(),remu:0,remuOps:[],months,any:false};
  const proAcct=hasPro();
  for(const k of monthKeys(a,b)) for(const o of (BYMONTH[k]||[])){
    R.any=true;
    if(o.src==='rev'){R.pro.any=true;if(fileInc){R.pro.income+=o.amount;R.pro.inc.revenus=(R.pro.inc.revenus||0)+o.amount}continue}
    const x=!o.cat&&INTERNAL[o.id]?BYID[INTERNAL[o.id]]:null;
    if(x){ if(o.amount<0){const r=remuDir(o,x);if(r){R.remu+=r*-o.amount;R.remuOps.push(o)}} continue }
    const c=catOf(o)||'_pending';
    if(c==='_pending'&&o.amount>0) continue;
    const ty=c==='_pending'?'expense':typeOf(c);
    if(ty==='transfer') continue;
    if(ty==='remu'){
      if(o.amount<0&&acctType(o)!=='perso'){R.remu+=-o.amount;R.remuOps.push(o)}
      else if(o.amount>0&&!proAcct){R.remu+=o.amount;R.remuOps.push(o)}
      continue;
    }
    const B=R[univOf(o,c)]; B.any=true;
    if(ty==='income'){if(c==='revenus'&&fileInc&&B===R.pro)continue;B.income+=o.amount;B.inc[c]=(B.inc[c]||0)+o.amount;continue}
    const e=B.by[c]||(B.by[c]={spent:0,ref:0,ops:[]});
    if(o.amount<0) e.spent+=-o.amount; else e.ref+=o.amount;
    e.ops.push(o);
  }
  for(const B of [R.pro,R.perso]){for(const c in B.by){B.by[c].net=B.by[c].spent-B.by[c].ref;B.net+=B.by[c].net;if(catById(c)?.fixed)B.fixed+=B.by[c].net}}
  /* Pro : les cotisations et impôts payés sont la provision elle-même, on ne les compte pas deux fois */
  const X=R.pro; X.provPaid=0; for(const c in X.by) if(PROV_CATS.has(c)||catById(c)?.prov) X.provPaid+=X.by[c].net;
  X.fraisExpl=X.net-X.provPaid; X.resultat=X.income-X.fraisExpl;
  const base=S.settings.assiette==='resultat'?Math.max(0,X.resultat):Math.max(0,X.income);
  X.provision=base*(+S.settings.taux||0)/100; X.revenuNet=X.income-X.fraisExpl-X.provision;
  return RAW[ck]=R;
}
/* Vue d'une période pour un univers : 'pro', 'perso' ou 'all' (vue d'ensemble) */
function agg(p,U){
  U=U||UNIV;
  const ck=p.lvl+p.y+'-'+p.m+(p.lvl==='Q'?Math.ceil(p.m/3):'')+'|'+U; if(AGG[ck]) return AGG[ck];
  const R=aggRaw(p), X=R.pro, pro={ca:X.income,frais:X.net,provPaid:X.provPaid,fraisExpl:X.fraisExpl,resultat:X.resultat,provision:X.provision,revenuNet:X.revenuNet,remu:R.remu,remuOps:R.remuOps};
  let v;
  if(U==='pro') v={...X,...pro,months:R.months,any:X.any||R.remu!==0};
  else if(U==='perso'){const inc={...R.perso.inc};if(R.remu)inc.remu=R.remu;
    v={...R.perso,inc,income:R.perso.income+R.remu,...pro,months:R.months,any:R.perso.any||R.remu!==0}}
  else{
    const by={}; for(const B of [R.perso,R.pro]) for(const c in B.by){const e=by[c]||(by[c]={spent:0,ref:0,net:0,ops:[]});e.spent+=B.by[c].spent;e.ref+=B.by[c].ref;e.net+=B.by[c].net;e.ops=e.ops.concat(B.by[c].ops)}
    const inc={}; for(const B of [R.perso,R.pro]) for(const c in B.inc) inc[c]=(inc[c]||0)+B.inc[c];
    v={by,inc,income:R.perso.income+X.income,net:R.perso.net+X.net,fixed:R.perso.fixed,...pro,months:R.months,any:R.any};
  }
  return AGG[ck]=v;
}
/* Trésorerie des comptes pro : dernier solde connu + opérations postérieures. null si aucun solde n'est connu. */
function tresoPro(){
  const pros=S.accounts.filter(a=>a.type==='pro'); if(!pros.length) return null;
  let t=0,known=0,missing=[],date='';
  for(const a of pros){
    const ops=S.ops.filter(o=>o.acct===a.id);
    const last=ops.reduce((m,o)=>o.date>m?o.date:m,''); if(last>date) date=last;
    if(a.solde==null||!a.soldeDate){missing.push(a.name);continue}
    known++; t+=a.solde+ops.filter(o=>o.date>a.soldeDate).reduce((s,o)=>s+o.amount,0);
  }
  return known?{t,missing,date}:{t:null,missing,date};
}
/* Provision de l'année civile jusqu'au dernier relevé, moins les cotisations et impôts déjà payés */
function resteAProvisionner(){
  const last=S.ops.reduce((m,o)=>o.date>m?o.date:m,''); if(!last) return {du:0,cumul:0,paye:0};
  const y=+last.slice(0,4), m=+last.slice(5,7); let cumul=0,paye=0;
  for(let i=1;i<=m;i++){const R=aggRaw({lvl:'M',y,m:i});cumul+=R.pro.provision;paye+=R.pro.provPaid}
  return {du:Math.max(0,cumul-paye),cumul,paye,y};
}

function mergeCats(saved){

let MIGRATED=false;
function merge(x){
  const st={...x,schemaVersion:x.schemaVersion||1,accounts:x.accounts||[],categories:mergeCats(x.categories),rules:x.rules||{},sugg:x.sugg||{},ops:x.ops||[],incomeSource:x.incomeSource||'bank',settings:{...SET0,...(x.settings||{})},challenges:x.challenges||[],readers:x.readers||[]};
  if(!st.since&&st.ops.length){st.since=Date.now();MIGRATED=true}
  if(!st.masked) st.masked={};
  st.game={seenLevel:null,backups:0,cagnotte:{nom:'',montant:0},...(st.game||{})};
  st.challenges.forEach(c=>{if(!c.key)c.key=newId('d_')});

  return st;

/* Migrations de schéma, dans l'ordre. Chaque étape est rejouable sans risque. */
function migrateSchema(st){
  const v0=st.schemaVersion;
  if(st.schemaVersion<2){
    /* v1 → v2 : le nom de compte porté par chaque opération devient une fiche de compte avec un type */
    const byName={};
    for(const o of st.ops){ if(o.src==='rev') continue;
      const n=o.acct||'Compte principal';
      let a=byName[n];
      if(!a){const bank=(BANKS.find(([b])=>b===n)||[])[0]||detectBank(n)||'';
        a=byName[n]={id:newId('a_'),name:n,bank,no:'',type:guessType(bank,'',n),confirmed:false,solde:null,soldeDate:''};st.accounts.push(a)}
      o.acct=a.id; }
    /* L'ancien type « pro » devient une dépense de l'univers pro */
    st.categories.forEach(c=>{
      if(c.type==='pro'){c.type='expense';c.univers='pro'}
      if(c.id==='pro'&&c.name==='Frais professionnels') c.name='Autres frais professionnels';
      if(!c.univers){const d=CATS0.find(k=>k.id===c.id);c.univers=d?d.univers:(c.type==='income'?'auto':'perso')}
    });
    st.schemaVersion=2;
  }
  if(st.schemaVersion<3){
    /* v2 → v3 : 160 heures par mois par défaut au lieu de 140, sauf si la valeur avait été modifiée */
    if(+st.settings.heures===140) st.settings.heures=160;
    if(!st.settings.netVise) st.settings.netVise=2000;
    st.schemaVersion=3;
  }
  return st.schemaVersion!==v0;
}

function migrate(){
  let ch=false; const old=new Set();
  for(const o of S.ops){ if(o.src==='rev') continue;
    const nm=merchantOf(o.label);
    if(nm!==o.merchant){ if(S.rules[o.merchant]&&!S.rules[nm]&&!brandOf(o.label)) S.rules[nm]=S.rules[o.merchant];
      old.add(o.merchant); o.merchant=nm; dirtyMonths.add(o.date.slice(0,7)); ch=true }
    const ac=autoCatOf(o.label); if(ac&&!S.rules[o.merchant]){S.rules[o.merchant]=ac;delete S.sugg[o.merchant];ch=true}
  }

  old.forEach(m=>{if(!live.has(m)){delete S.rules[m];delete S.sugg[m]}});

function pendingGroups(){
  const g={};
  for(const o of S.ops){ if(catOf(o)) continue;
    const key=S.rules[o.merchant]?o.merchant+(o.amount>0?'|+':'|-'):o.merchant;
    const e=g[key]||(g[key]={m:key,n:0,total:0,label:o.label,refunds:0,accts:[]});e.accts.push(o.acct);

/* ============ Synthèses : vue d'ensemble, pro, perso ============ */
function alertFor(cid,net,months,U){
  const c=catById(cid);
  if(c&&c.budget>0){const b=c.budget*months; if(net>b) return [net>b*1.2?'crit':'warn',`budget dépassé de ${eur0(net-b)}`]; if(net>b*.9) return ['warn','budget presque atteint']; return null}
  let sum=0,k=0; for(let i=1;i<=3;i++){const a=agg(shift(P,-i),U); if(a.any){sum+=(a.by[cid]?.net||0);k++}}
  if(!k||net<=0) return null; const avg=sum/k; if(avg<20) return null;
  const r=net/avg;
  if(r>1.5) return ['crit',`+${Math.round((r-1)*100)} % sur la moyenne`];
  if(r>1.15) return ['warn',`+${Math.round((r-1)*100)} % sur la moyenne`];
  if(r<.8) return ['good',`${Math.round((r-1)*100)} % sous la moyenne`];
  return null;
}
/* Barres mensuelles : dépenses (perso, vue d'ensemble) ou chiffre d'affaires (pro) */
function trend(U,metric,label){
  metric=metric||(a=>a.net); let pts=[];
  if(P.lvl==='M'){for(let i=5;i>=0;i--){const p={lvl:'M',...shift(P,-i)};pts.push({l:MOIS[p.m-1].slice(0,3)+'.',v:metric(agg(p,U)),cur:i===0})}}
  else{const [a]=bounds(P);const y=+a.slice(0,4),m0=+a.slice(5,7);const n=P.lvl==='Q'?3:12;for(let i=0;i<n;i++){const p={lvl:'M',y,m:m0+i};pts.push({l:MOIS[p.m-1].slice(0,P.lvl==='Y'?1:3)+(P.lvl==='Y'?'':'.'),v:metric(agg(p,U)),cur:false})}}
  const max=Math.max(1,...pts.map(p=>p.v)); const W=600,H=160,bh=118,gap=W/pts.length,bw=Math.min(46,gap*.42);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||'Évolution des dépenses')}">
  <line x1="0" x2="${W}" y1="${bh}" y2="${bh}" stroke="var(--line)"/>
  ${pts.map((p,i)=>{const h=Math.max(p.v>0?2:0,p.v/max*(bh-18));const x=i*gap+gap/2;return `
    <rect x="${x-bw/2}" y="${bh-h}" width="${bw}" height="${h}" fill="${p.cur?'var(--gold)':'var(--ink)'}" opacity="${p.cur?1:.82}"/>
    ${p.v>0&&pts.length<=6?`<text x="${x}" y="${bh-h-7}" text-anchor="middle" font-size="17" fill="var(--muted)" font-family="Jost, sans-serif">${esc(eur0(p.v))}</text>`:''}
    <text x="${x}" y="${bh+22}" text-anchor="middle" font-size="18" fill="var(--muted)" font-family="Jost, sans-serif">${esc(p.l)}</text>`}).join('')}
  </svg>`;
}
function donut(rows,title){
  const pos=rows.filter(([,e])=>e.net>0); const sum=pos.reduce((s,[,e])=>s+e.net,0);
  if(!pos.length||sum<=0) return '';
  let items=pos.map(([cid,e])=>({cid,v:e.net,name:cid==='_pending'?'À classer':(catById(cid)?.name||cid)}));
  if(items.length>7){const rest=items.slice(6);items=items.slice(0,6);items.push({cid:null,v:rest.reduce((s,x)=>s+x.v,0),name:`Autres postes (${rest.length})`})}
  const COLS=[['var(--gold)',1],['var(--ink)',1],['var(--gold)',.62],['var(--ink)',.55],['var(--gold)',.34],['var(--ink)',.28],['var(--muted)',.35]];
  const R=80,C=2*Math.PI*R,GAP=items.length>1?2.2:0; let off=0;
  const arcs=items.map((x,i)=>{const len=x.v/sum*C;const [col,op]=COLS[i%COLS.length];
    const s=`<circle ${x.cid?`data-cat="${x.cid}"`:''} cx="100" cy="100" r="${R}" fill="none" stroke="${col}" stroke-opacity="${op}" stroke-width="12" stroke-dasharray="${Math.max(0.5,len-GAP)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(x.name)}</title></circle>`;
    off+=len; return s}).join('');
  return `<h3 class="sec">${title||'Répartition des postes'}</h3>
  <div class="split">
    <svg viewBox="0 0 200 200" role="img" aria-label="Répartition par poste">
      ${arcs}
      <text x="100" y="100" text-anchor="middle" font-family="Bodoni Moda, Didot, serif" font-size="34" fill="var(--ink)">${Math.round(items[0].v/sum*100)} %</text>
      <text x="100" y="121" text-anchor="middle" font-family="Jost, sans-serif" font-size="11" fill="var(--muted)">${esc(items[0].name.length>22?items[0].name.split(' ')[0]:items[0].name)}</text>
    </svg>
    <div class="legend">${items.map((x,i)=>{const [col,op]=COLS[i%COLS.length];return `<button ${x.cid?`data-cat="${x.cid}"`:'disabled'}><i style="background:${col};opacity:${op}"></i><span>${esc(x.name)}</span><span class="pc">${Math.round(x.v/sum*100)} %</span><span class="am">${eur0(x.v)}</span></button>`}).join('')}</div>
  </div>`;
}
function catList(rows,A,U){
  const max=Math.max(1,...rows.map(([,e])=>e.net));
  return `<div class="cats">${rows.length?rows.map(([cid,e])=>{
    const c=catById(cid), pend=cid==='_pending';
    const al=pend?null:alertFor(cid,e.net,A.months,U);
    const bud=c&&c.budget>0?c.budget*A.months:0;
    const meta=esc([A.months>1?`${eur0(e.net/A.months)} par mois en moyenne`:'',e.ref>0?`dont ${eur0(e.ref)} remboursés`:'',pend?'à classer dans l’onglet À valider':''].filter(Boolean).join(', '))+(al?`${e.ref>0||A.months>1?', ':''}<span class="m-${al[0]}">${esc(al[1])}</span>`:'');
    const open=openCat===cid;
    return `<div class="cat${pend?' pending':''}">

        <div class="cat-amt">${eur0(e.net)}</div>
        <div class="meter"><span style="width:${Math.max(0,e.net/max*100)}%"></span>${bud?`<em style="left:${Math.min(100,bud/max*100)}%" title="Budget"></em>`:''}</div>
      </button>
      ${open?`<div class="cat-ops">${e.ops.slice().sort((a,b)=>a.date<b.date?1:-1).map(opRow).join('')}</div>`:''}

}

function bigAmount(n){const eurs=Math.floor(Math.abs(n)), cts=Math.round((Math.abs(n)-eurs)*100);

function toDate(c){
  if(c instanceof Date&&!isNaN(c)){const t=new Date(c.getTime()-c.getTimezoneOffset()*60000+43200000);return t.toISOString().slice(0,10)}
  const s=String(c??'').trim(); let m;
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/)) return `${m[3].length===2?'20'+m[3]:m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function toAmt(c){
  if(typeof c==='number') return c;
  let s=String(c??'').replace(/[€\s\u00a0\u202f]/g,''); if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  return /^[-+]?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN;
}
function csvRows(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  const sep=(lines[0].split(';').length>=lines[0].split(',').length)?';':',';
  return lines.map(l=>{const out=[];let cur='',inq=false;for(const ch of l){if(ch==='"'){inq=!inq;continue}if(ch===sep&&!inq){out.push(cur);cur='';continue}cur+=ch}out.push(cur);return out.map(s=>s.trim())});
}
function bestCol(body,test){let best=-1,bn=0;const w=Math.max(0,...body.map(r=>r.length));for(let i=0;i<w;i++){const n=body.filter(r=>test(r[i])).length;if(n>bn){bn=n;best=i}}return best}
function detect(){
  const d=revDraft, rows=d.sheets[d.sheet].rows;
  let h=0;
  for(let i=0;i<Math.min(15,rows.length);i++){const r=rows[i].map(c=>norm(cellStr(c)));
    if(r.some(c=>/DATE/.test(c))&&r.some(c=>/MONTANT|TOTAL|TTC|\bHT\b|NET|ENCAISS|SOMME|PRIX|CHIFFRE|\bCA\b/.test(c))){h=i;break}}
  const H=(rows[h]||[]).map(c=>norm(cellStr(c)));
  const find=(res,noDate)=>{for(const re of res){const i=H.findIndex(c=>re.test(c)&&!(noDate&&/DATE/.test(c)));if(i>=0)return i}return -1};
  d.h=h;
  d.date=find([/DATE.*(ENCAISS|PAIEMENT|REGLEMENT|RECEPTION)|(ENCAISS|PAIEMENT|REGLEMENT).*DATE/,/DATE/]);
  d.amt=find([/ENCAISS/,/\bNET\b/,/TTC/,/\bHT\b/,/MONTANT|TOTAL|SOMME|PRIX|CHIFFRE|\bCA\b/],true);
  d.lab=find([/CLIENT/,/LIBELLE|DESCRIPTION|OBJET|INTITULE|PRESTATION|DESIGNATION/],true);
  const body=rows.slice(h+1,h+40);
  if(d.date<0) d.date=bestCol(body,c=>!!toDate(c));
  if(d.amt<0) d.amt=bestCol(body,c=>typeof c==='number');
  if(d.date<0) d.date=0; if(d.amt<0) d.amt=Math.min(1,Math.max(0,H.length-1));
}

function recurring(){

    const c=catOf(o); if(!c||['income','transfer','remu'].includes(typeOf(c))||['pret','courses','resto','transport','shopping'].includes(c)) continue;
    const e=g[o.merchant]||(g[o.merchant]={m:o.merchant,c,by:{},amts:[]}); e.by[k]=(e.by[k]||0)+1; e.amts.push(-o.amount); }

/* ============ Taux horaire et revenu net visé ============ */
const heures=()=>+S.settings.heures||SET0.heures;
const netVise=()=>+S.settings.netVise||SET0.netVise;
const tauxCible=()=>netVise()/heures();
/* Revenu net et taux horaire réel : sur la période affichée (moyenne par mois) et lissés sur 12 mois */
function activite(p){
  const H=heures(), V=netVise(), A=agg(p,'pro');
  const net=A.revenuNet/A.months;
  const e=endOf(p); const ms=monthsTo(e.y,e.m,12).map(q=>({q,a:agg(q,'pro')})).filter(x=>x.a.any);
  const lisse=ms.length?ms.reduce((s,x)=>s+x.a.revenuNet,0)/ms.length:null;
  return {H,V,cible:V/H,net,taux:net/H,manque:Math.max(0,V-net),ok:net>=V,any:A.any&&(A.ca>0||A.frais>0),
    lisse,tauxLisse:lisse!=null?lisse/H:null,nLisse:ms.length,A};
}
/* Mois affiché encore incomplet : le dernier relevé s'arrête avant la fin du mois */
function moisPartiel(p){
  if(p.lvl!=='M') return null;
  const k=p.y+'-'+pad(p.m), last=(BYMONTH[k]||[]).reduce((m,o)=>o.date>m?o.date:m,'');
  const dim=new Date(p.y,p.m,0).getDate();
  return last&&+last.slice(8,10)<dim-3&&lastOpDate().slice(0,7)===k?+last.slice(8,10):null;
}
/* Pistes chiffrées pour combler l'écart */
function pistes(X){
  const t=(+S.settings.taux||0)/100, ca=X.A.ca/X.A.months, frais=X.A.fraisExpl/X.A.months, out=[];
  if(ca>0&&X.manque>0){const d=X.manque/(1-t);out.push(`Augmenter vos tarifs d’environ ${Math.ceil(d/ca*100)} %, soit ${eur0(d)} de chiffre d’affaires en plus par mois.`)}
  if(X.net>0&&X.net/X.cible<X.H) out.push(`Ou travailler ${Math.round(X.net/X.cible)} h par mois au lieu de ${X.H} h : pour le même revenu, votre heure vaudrait ${eur(X.cible)}.`);
  if(frais>0){const d=S.settings.assiette==='resultat'?X.manque/(1-t):X.manque;
    out.push(d<=frais?`Ou réduire vos frais pro de ${eur0(d)} par mois, sur ${eur0(frais)} aujourd’hui.`:`Ou réduire vos frais pro, qui s’élèvent à ${eur0(frais)} par mois.`)}
  return out;
}
/* Taux horaire réel sur 12 mois, avec la ligne du taux visé */
function courbeTaux(){
  const e=endOf(P), ms=monthsTo(e.y,e.m,12).map(q=>{const a=agg(q,'pro');return {q,any:a.any,v:a.revenuNet/heures()}});
  if(ms.filter(x=>x.any).length<2) return '';
  const c=tauxCible(), vals=ms.filter(x=>x.any).map(x=>x.v);
  const max=Math.max(c*1.25,...vals), min=Math.min(0,...vals);
  const W=600,H=190,top=16,bh=150,gap=W/12,bw=gap*.5, y=v=>top+(max-v)/(max-min)*(bh-top), y0=y(0), yc=y(c);

    <text x="${cx}" y="${H-6}" text-anchor="middle" font-size="16" fill="var(--muted)" font-family="Jost, sans-serif">${MOIS[x.q.m-1][0]}</text>`}).join('')}
  <line x1="0" x2="${W}" y1="${yc}" y2="${yc}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="${W}" y="${yc-6}" text-anchor="end" font-size="15" fill="var(--gold)" font-family="Jost, sans-serif">${esc(eur(c))}</text>

}
/* ============ Alertes : critique, attention, bonne nouvelle ============ */
let ALERTS={};
const NIV={crit:0,warn:1,good:2};
const periodeKey=()=>P.lvl+P.y+'-'+P.m;
const quandP=()=>P.lvl==='M'?'Ce mois-ci':P.lvl==='Q'?'Ce trimestre':'Cette année';

/* Revenu net et taux horaire (étape B), sous forme d'alerte */
function alerteRevenuObj(){
  const X=activite(P); if(!X.any) return null;
  const quand=quandP(), moy=P.lvl==='M'?'':' en moyenne par mois';
  const part=moisPartiel(P), note=part?` Le mois n’est pas terminé : votre dernier relevé s’arrête au ${part}.`:'';
  const lis=X.tauxLisse!=null&&X.nLisse>=3?`<p class="d">Sur les ${X.nLisse} derniers mois, en moyenne : ${eur(X.tauxLisse)} de l’heure, soit ${eur0(X.lisse)} nets par mois${X.lisse>=X.V?', au-dessus de votre objectif : ce mois plus faible n’est pas une tendance':''}.</p>`:'';
  if(X.ok) return {id:'revenu-ok',level:'good',icon:'sparkles',tab:'synthese',score:0,
    title:`${quand}, votre travail vous a rapporté <b>${eur(X.taux)} de l’heure</b>${moy}, pour ${eur(X.cible)} visés.`,
    detail:`Objectif de ${eur0(X.V)} nets atteint, avec ${eur0(X.net-X.V)} d’avance.${note}`,extra:lis};
  const ps=pistes(X);
  return {id:'revenu',level:'crit',icon:'triangle-alert',tab:'synthese',score:X.manque,
    title:X.net<=0?`${quand}, votre travail ne vous a rien rapporté : le revenu net est de <b>${signed(X.net)}</b>${moy}.`:`${quand}, votre travail vous a rapporté <b>${eur(X.taux)} de l’heure</b>${moy}, pour ${eur(X.cible)} visés.`,
    detail:`Il manque <b>${eur0(X.manque)}</b>${moy} pour atteindre ${eur0(X.V)} nets, pour ${X.H} heures travaillées.${note}`,
    extra:lis+(ps.length?`<ul class="pistes">${ps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''),
    acts:[UNIV!=='pro'?btn('Voir mes chiffres pro','data-univ="pro"'):'',btn('Ajuster mon objectif ou mes heures','data-tab="regles"')]};
}

function computeAlerts(U){
  if(ALERTS[U]) return ALERTS[U];
  const out=[], add=a=>{if(a)out.push(a)};
  const quand=quandP(), mois=P.lvl==='M', part=moisPartiel(P);
  const A=agg(P,U), Pe=agg(P,'perso'), All=agg(P,'all');
  const prev=[1,2,3].map(i=>agg(shift(P,-i),U)).filter(a=>a.any);
  const st=stats(P,'all');

  /* Critique */
  if(U!=='perso') add(alerteRevenuObj());
  const base=U==='perso'?Pe:U==='all'?All:null;
  if(base&&base.any&&base.income-base.net<0) add({id:'solde',level:'crit',icon:'trending-down',tab:'synthese',score:base.net-base.income,
    title:`${quand}, ${U==='perso'?'vos dépenses personnelles dépassent vos rentrées':'il est sorti plus d’argent qu’il n’en est entré'} de <b>${eur0(base.net-base.income)}</b>.`,
    detail:U==='perso'&&hasPro()&&!Pe.inc.remu?'Aucune rémunération n’a été versée depuis votre compte pro sur la période : ce n’est peut-être qu’un décalage.':part?`Le mois n’est pas terminé : votre dernier relevé s’arrête au ${part}.`:'Regardez les postes qui pèsent le plus, juste en dessous.'});
  if(U!=='pro'&&st.autonomie!=null&&st.autonomie<3){const crit=st.autonomie<1;
    add({id:'matelas',level:crit?'crit':'warn',icon:crit?'shield-alert':'shield',tab:'objectifs',score:3-st.autonomie,
      title:`Votre matelas de sécurité ne couvre que <b>${fmt1(st.autonomie)} mois</b> de dépenses.`,
      detail:`${eur0(+S.settings.epargne)} d’épargne pour ${eur0(st.depMoy)} de dépenses par mois. ${crit?'Un mois sans encaissement suffirait à le vider : mettre de côté, même un peu, chaque mois, change beaucoup.':'Trois mois d’avance permettent de traverser un creux d’activité sereinement.'}`,
      acts:[btn('Voir mon matelas','data-tab="objectifs"')]})}
  if(U!=='perso'){const tr=tresoPro(), du=resteAProvisionner();
    if(tr&&tr.t!=null&&du.du>0&&tr.t<du.du) add({id:'tresorerie',level:'crit',icon:'landmark',tab:'synthese',score:du.du-tr.t,
      title:`Votre compte pro contient ${eur0(tr.t)}, mais <b>${eur0(du.du)}</b> sont à garder pour les cotisations et les impôts.`,
      detail:`Il manque ${eur0(du.du-tr.t)} : vous risquez de ne pas pouvoir payer l’URSSAF à la prochaine échéance. Évitez de vous verser une rémunération tant que l’écart n’est pas comblé.`,
      acts:[U!=='pro'?btn('Voir ma trésorerie','data-univ="pro"'):'']})}
  for(const [cid,e] of Object.entries(A.by)){const c=catById(cid); if(!c||!c.budget) continue;
    const b=c.budget*A.months, r=e.net/b; if(r<=1) continue;
    add({id:'budget:'+cid,level:r>1.2?'crit':'warn',icon:'gauge',tab:'synthese',score:r,
      title:`Budget ${esc(c.name)} dépassé de <b>${Math.round((r-1)*100)} %</b> : ${eur0(e.net)} pour ${eur0(b)} prévus.`,
      detail:r>1.2?'Au-delà de 20 %, ce n’est plus un écart ponctuel : ajustez le budget ou ce poste.':'',acts:[btn('Voir le détail',`data-cat="${cid}"`)]})}

  /* Attention */
  const moyennes=Object.entries(A.by).filter(([cid])=>cid!=='_pending'&&!(catById(cid)?.budget)).map(([cid,e])=>{
    const avg=prev.length?prev.reduce((s,a)=>s+(a.by[cid]?.net||0),0)/prev.length:0;return {cid,net:e.net,avg}}).filter(x=>x.avg>=50);
  moyennes.filter(x=>x.net>x.avg*1.2&&x.net-x.avg>=30).sort((a,b)=>(b.net-b.avg)-(a.net-a.avg)).slice(0,2).forEach(x=>
    add({id:'hausse:'+x.cid,level:'warn',icon:'trending-up',tab:'synthese',score:x.net/x.avg,
      title:`${esc(catById(x.cid).name)} en hausse de <b>${Math.round((x.net/x.avg-1)*100)} %</b> : ${eur0(x.net)}, pour ${eur0(x.avg)} en moyenne.`,
      acts:[btn('Voir le détail',`data-cat="${x.cid}"`)]}));
  if(mois){
    const k=P.y+'-'+pad(P.m), debut=k+'-01';
    const seen=new Set();
    for(const o of (BYMONTH[k]||[])){ if(o.amount>=0||o.src==='rev'||seen.has(o.merchant)) continue;
      const c=catOf(o); if(!SUBS.has(c)||(U!=='all'&&opUniv(o)!==U)) continue; seen.add(o.merchant);
      const avant=S.ops.filter(x=>x.merchant===o.merchant&&x.amount<0&&x.date<debut).sort((a,b)=>a.date<b.date?1:-1);
      if(!avant.length){ add({id:'abo-nouveau:'+o.merchant,level:'warn',icon:'repeat',tab:'economies',score:0,
        title:`Nouvel abonnement : <b>${esc(o.merchant)}</b>, ${eur(-o.amount)} par mois.`,detail:`Soit ${eur0(-o.amount*12)} par an. Vérifiez qu’il vous est vraiment utile.`,acts:[btn('Voir les abonnements','data-tab="economies"')]}); continue }
      const avantP=avant[0], d=-o.amount-(-avantP.amount);
      if(d>=1&&d>(-avantP.amount)*.05) add({id:'abo-hausse:'+o.merchant,level:'warn',icon:'badge-euro',tab:'economies',score:-o.amount,
        title:`Le prélèvement <b>${esc(o.merchant)}</b> passe de ${eur(-avantP.amount)} à ${eur(-o.amount)}.`,detail:`Soit ${eur0(d*12)} de plus par an.`,acts:[btn('Voir les abonnements','data-tab="economies"')]});
    }
  }
  if(U!=='pro'){const w=waitingReturns().filter(o=>(Date.now()-new Date(o.date))/864e5>30);
    if(w.length) add({id:'retours',level:'warn',icon:'package-open',tab:'remb',score:w.length,
      title:`${w.length>1?`${w.length} retours attendent`:'Un retour attend'} leur remboursement depuis plus de 30 jours : <b>${eur0(-w.reduce((s,o)=>s+o.amount,0))}</b>.`,
      detail:'Relancez le vendeur : passé un certain délai, le remboursement devient plus difficile à obtenir.',acts:[btn('Voir les retours','data-tab="remb"')]})}
  if(U!=='perso'&&mois&&!part){const ca=[0,1,2,3].map(i=>agg(shift(P,-i),'pro'));
    if(ca.every(a=>a.any&&a.ca>0)&&ca[0].ca<ca[1].ca&&ca[1].ca<ca[2].ca&&ca[2].ca<ca[3].ca) add({id:'ca-baisse',level:'warn',icon:'chart-no-axes-column-decreasing',tab:'synthese',score:ca[3].ca-ca[0].ca,
      title:`Votre chiffre d’affaires baisse depuis trois mois : <b>${ca.slice().reverse().map(a=>eur0(a.ca)).join(', puis ')}</b>.`,
      detail:'C’est le bon moment pour relancer vos clients ou prospecter, avant que la baisse ne pèse sur votre trésorerie.'})}
  const pg=pendingGroups();
  if(pg.length){const n=pg.reduce((s,g)=>s+g.n,0);
    add({id:'non-classees',level:'warn',icon:'circle-help',tab:'valider',score:n,
      title:`${n} opération${n>1?'s ne sont':' n’est'} pas encore classée${n>1?'s':''}, chez ${pg.length} marchand${pg.length>1?'s':''}.`,
      detail:'Vos chiffres sont incomplets tant qu’elles ne sont pas rangées. Une seule question par marchand suffit.',acts:[btn('Les classer','data-tab="valider"')]})}
  if(S.ops.length&&!demo){const ref=S.lastBackup||S.since||Date.now(), j=Math.floor((Date.now()-ref)/864e5);
    if(j>=30) add({id:'sauvegarde',level:'warn',icon:'hard-drive-download',tab:'regles',score:j,
      title:S.lastBackup?`Aucune sauvegarde depuis <b>${j} jours</b>.`:'Vous n’avez encore jamais sauvegardé vos données.',
      detail:'Elles ne sont enregistrées que dans ce navigateur : une sauvegarde les protège si vous changez d’appareil ou videz votre navigateur.',acts:[btn('Sauvegarder maintenant','data-act="backup"')]})}

  /* Bonnes nouvelles */
  if(!part) moyennes.filter(x=>x.net<x.avg*.75).sort((a,b)=>(b.avg-b.net)-(a.avg-a.net)).slice(0,2).forEach(x=>
    add({id:'baisse:'+x.cid,level:'good',icon:'trending-down',tab:'synthese',score:0,
      title:`${esc(catById(x.cid).name)} : <b>${Math.round((x.net/x.avg-1)*100)} %</b> par rapport à votre moyenne.`,detail:`Soit ${eur0(x.avg-x.net)} de moins que d’habitude. Bien joué.`}));
  if(U!=='perso'&&mois&&!part){const X=agg(P,'pro');
    const an=Array.from({length:P.m},(_,i)=>agg({lvl:'M',y:P.y,m:i+1},'pro')).filter(a=>a.any);
    if(an.length>=3&&X.revenuNet>0&&an.every(a=>a.revenuNet<=X.revenuNet)) add({id:'record',level:'good',icon:'trophy',tab:'synthese',score:0,
      title:`Meilleur mois de l’année : <b>${eur0(X.revenuNet)} nets</b>, votre record de ${P.y}.`});
    const lis=st.ms.map(x=>agg(x.q,'pro')).filter(a=>a.any), moyCA=lis.length?lis.reduce((s,a)=>s+a.ca,0)/lis.length:0;
    if(lis.length>=3&&X.ca>moyCA*1.5) add({id:'gros-mois',level:'good',icon:'hand-coins',tab:'synthese',score:0,
      title:`Mois exceptionnel : <b>${eur0(X.ca)} encaissés</b>, ${Math.round((X.ca/moyCA-1)*100)} % de plus que votre moyenne.`,
      detail:X.provision>0?`Pensez à garder ${eur0(X.provision)} pour les cotisations et les impôts, et à renforcer votre matelas.`:'Pensez à mettre une partie de côté pour les mois plus calmes.'})}
  const pp=shift(P,-1), pk=pp.y+'-'+pad(pp.m);
  S.challenges.filter(c=>c.month===pk||c.month===P.y+'-'+pad(P.m)).map(evalDefi).filter(x=>x&&x.status==='réussi').forEach(x=>
    add({id:'defi:'+x.id+':'+x.month,level:'good',icon:'target',tab:'objectifs',score:0,title:`Défi réussi : <b>${esc(x.name)}</b>. Bravo.`,acts:[btn('Voir mes défis','data-tab="objectifs"')]}));
  if(U!=='pro'&&st.autonomie!=null){const avant=stats(shift(P,-1),'all').autonomie, obj=+S.settings.objectif||6;
    const pal=[...new Set([1,3,6,obj])].sort((a,b)=>b-a).find(x=>st.autonomie>=x&&avant!=null&&avant<x);

  out.sort((a,b)=>NIV[a.level]-NIV[b.level]||(b.score||0)-(a.score||0));
  return ALERTS[U]=out;
}
/* Une alerte masquée reste cachée pour la période, sauf si la situation s'aggrave */

function defiDef(c){

    return {id:'auto',kind:'mois',diff:'moyen',pts:120,type:'pct',pct:1-c.pct,sel:{cats:[c.cat]},name:`${n} −${Math.round(c.pct*100)} %`,desc:`Le défi du mois, choisi d’après votre poste variable le plus lourd.`}}
  return DEFIS.find(d=>d.id===c.id);
