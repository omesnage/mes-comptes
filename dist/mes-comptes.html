<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes comptes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#FAF7F0; --surface:#FFFDF8; --ink:#1A1918; --muted:#5F5850; --line:#E2DBCD;
  --gold:#9A763C; --gold-soft:#F3EAD8; --alert:#A3402F; --alert-soft:#F8EAE5;
  --amber:#A15F12; --amber-soft:#F8EDDB; --ok:#3B6A4A; --ok-soft:#E6EFE4;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --p-ciel:#E1ECF4; --i-ciel:#4A7CA6; --p-lavande:#EAE3F4; --i-lavande:#7C63AA; --p-menthe:#DFEFE5; --i-menthe:#4A8C66;
  --p-peche:#FBE9D9; --i-peche:#BF7A3F; --p-rose:#F8E3E7; --i-rose:#B65A6D; --p-sable:#ECE7DA; --i-sable:#857451;
  --nav:0px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141312; --surface:#1C1B19; --ink:#F0EBE1; --muted:#BDB4A6; --line:#34312C;
    --gold:#D2B071; --gold-soft:#2B2519; --alert:#EE9A86; --alert-soft:#2E1C18;
    --amber:#E5AE62; --amber-soft:#2D2416; --ok:#95C9A2; --ok-soft:#1B2A1F;
    --p-ciel:#1F2A33; --i-ciel:#8DB7DA; --p-lavande:#282233; --i-lavande:#B7A3DB; --p-menthe:#1D2B23; --i-menthe:#8FCBA6;
    --p-peche:#33271C; --i-peche:#E3A874; --p-rose:#33222A; --i-rose:#E39AAB; --p-sable:#2B2820; --i-sable:#CDBB92;
  }
}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1C1B19; --ink:#F0EBE1; --muted:#BDB4A6; --line:#34312C;
  --gold:#D2B071; --gold-soft:#2B2519; --alert:#EE9A86; --alert-soft:#2E1C18;
  --amber:#E5AE62; --amber-soft:#2D2416; --ok:#95C9A2; --ok-soft:#1B2A1F;
  --p-ciel:#1F2A33; --i-ciel:#8DB7DA; --p-lavande:#282233; --i-lavande:#B7A3DB; --p-menthe:#1D2B23; --i-menthe:#8FCBA6;
  --p-peche:#33271C; --i-peche:#E3A874; --p-rose:#33222A; --i-rose:#E39AAB; --p-sable:#2B2820; --i-sable:#CDBB92;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:22px 20px calc(60px + var(--nav))}
svg{flex:none}

/* En-tête et navigation */
header.top{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;padding-top:env(safe-area-inset-top,0px)}
.brand{white-space:nowrap;font-size:26px;font-weight:500;letter-spacing:-.01em}
.top-droite{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.btn-cloud{display:inline-flex;align-items:center;gap:6px;font-size:15px;min-height:44px}
.btn-cloud svg{width:16px;height:16px}
.actions-top{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.act-top{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;font-size:15px;line-height:1.25;color:var(--ink);background:var(--p);border:1px solid transparent;cursor:pointer;text-align:left}
.act-top svg{width:20px;height:20px;color:var(--i)}
.act-top:hover{border-color:var(--i)}
.act-top.ciel{--p:var(--p-ciel);--i:var(--i-ciel)}
.act-top.menthe{--p:var(--p-menthe);--i:var(--i-menthe)}
.act-top[hidden]{display:none}
.dern-sauv{font-size:15px;color:var(--muted)}
.status{font-size:15px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:26px}
nav.tabs:empty{display:none}
nav.tabs button{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;font-size:17px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--ink);border-color:var(--gold);font-weight:500}
nav.tabs button svg{color:var(--t,currentColor)}
nav.tabs button[aria-current="true"]{background:var(--tf,transparent);border-color:var(--t,var(--gold))}
nav.tabs button[data-tab="accueil"]{--t:var(--i-ciel);--tf:var(--p-ciel)}
nav.tabs button[data-tab="bilan"]{--t:var(--i-lavande);--tf:var(--p-lavande)}
nav.tabs button[data-tab="operations"]{--t:var(--i-menthe);--tf:var(--p-menthe)}
nav.tabs button[data-tab="importer"]{--t:var(--i-peche);--tf:var(--p-peche)}
nav.tabs button[data-tab="objectifs"]{--t:var(--i-rose);--tf:var(--p-rose)}
nav.tabs button[data-tab="reglages"]{--t:var(--i-sable);--tf:var(--p-sable)}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;margin-left:8px;padding:0 7px;border-radius:12px;background:var(--gold);color:var(--bg);font-size:15px;font-weight:500;line-height:1}
@media (max-width:700px){
  :root{--nav:76px}
  body{font-size:18px}
  .wrap{padding:16px 16px calc(40px + var(--nav) + env(safe-area-inset-bottom,0px))}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0;gap:0;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs button{flex:1;flex-direction:column;justify-content:center;gap:3px;min-height:var(--nav);padding:6px 4px;font-size:15px;border-bottom:0;border-top:2px solid transparent;margin:0;text-align:center}
  nav.tabs button[aria-current="true"]{border-top-color:var(--t,var(--gold))}
  nav.tabs button>span{display:flex;align-items:center;white-space:nowrap}
  .badge{min-width:22px;height:22px;margin-left:5px}
}
body.onb nav.tabs{display:none}
body.onb .wrap{padding-bottom:40px}
.demo-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:12px 16px;margin:0 0 22px;background:var(--gold-soft);font-size:16px}
.demo-bar button{text-decoration:underline;text-underline-offset:4px;min-height:44px}

/* Éléments communs */
.carte{display:block;background:var(--surface);border:1px solid var(--line);padding:22px 20px;margin:0 0 20px;width:100%}
.carte h3{font-weight:500;font-size:22px;line-height:1.3;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.carte h3 svg{width:22px;height:22px;color:var(--gold)}
.carte h4{font-weight:500;font-size:17px;margin:26px 0 8px}
.titre-page{font-weight:500;font-size:30px;margin:0 0 20px}
.phrase{font-size:18px;margin:8px 0}
.phrase.rouge{color:var(--alert)}
.aide{font-size:16px;color:var(--muted);margin:8px 0;line-height:1.5}
.aide.centre{text-align:center;padding:30px 0}
.ok-txt{color:var(--ok);font-size:16px}.ko-txt{color:var(--alert);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 24px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:500;border:1px solid var(--ink);text-align:center}
.btn:hover{opacity:.9}
.btn.secondaire{background:transparent;color:var(--ink)}
.btn.secondaire:hover{background:var(--gold-soft)}
.btn[disabled]{opacity:.45;pointer-events:none}
label.btn{cursor:pointer}
.boutons{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.lien{font-size:16px;text-decoration:underline;text-underline-offset:4px;min-height:44px;display:inline-flex;align-items:center;color:var(--ink)}
.lien.danger,.danger{color:var(--alert)}
.note-box{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);background:var(--surface);margin:0 0 20px}
.note-box p{margin:0;font-size:16px}
.note-box svg{width:22px;height:22px;color:var(--gold);margin-top:2px}
.alerte-box{border-color:var(--alert);background:var(--alert-soft)}
.alerte-box svg{color:var(--alert)}
.champ{display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--muted);margin:0 0 16px}
.champ input,.grand{min-height:52px;padding:10px 14px;font-size:18px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0;width:100%}
select.grand{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.champ input:focus,.grand:focus{border-color:var(--gold);outline:none}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:17px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"›";display:inline-block;width:18px;color:var(--gold);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.repli>summary{font-size:20px;font-weight:500}
.radios{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.radios label{display:flex;align-items:center;gap:12px;min-height:44px;font-size:17px;cursor:pointer}
.radios input{width:22px;height:22px;accent-color:var(--gold)}
.f-lbl{font-size:16px;color:var(--muted);margin:16px 0 8px;display:block}

/* Mois */
.mois{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 20px}
.mois h2{font-weight:500;font-size:26px;margin:0;text-align:center;flex:1}
.fleche{width:52px;height:52px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.fleche svg{width:22px;height:22px}
.fleche:hover{border-color:var(--gold)}

/* Accueil */
.grand-chiffre{font-size:clamp(52px,14vw,64px);font-weight:300;letter-spacing:-.02em;line-height:1.05;margin:4px 0 14px;font-variant-numeric:tabular-nums lining-nums}
.etiquette{display:inline-block;padding:8px 14px;font-size:17px;font-weight:500;margin:0 0 6px}
.etiquette.ok{background:var(--ok-soft);color:var(--ok)}
.etiquette.ko{background:var(--alert-soft);color:var(--alert)}
.ligne{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:18px}
.ligne b{font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.ligne.total{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;font-weight:500}
.ligne.total b{font-weight:500;font-size:22px}
.balance{margin:14px 0 4px}
.balance .ligne.ok b{color:var(--ok)}
.balance .ligne.ko b{color:var(--alert)}
.balance .aide{margin-top:8px}
.rubriques{margin-top:10px}
.rub{display:grid;grid-template-columns:30px 1fr auto;gap:4px 14px;align-items:center;width:100%;padding:14px 0 12px;border-bottom:1px solid var(--line);min-height:56px}
.rub>svg{width:24px;height:24px;color:var(--gold)}
.rub-nom{font-size:18px;display:flex;flex-direction:column}
.rub-mention{font-size:15px;color:var(--amber);font-weight:500}
.rub-amt{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.barre{grid-column:2/4;height:4px;background:var(--line);position:relative;border-radius:2px}
.barre span{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:2px}
.rub.derape>svg,.rub.derape .rub-amt{color:var(--amber)}
.rub.derape .barre span{background:var(--amber)}
.rub-ops{padding:4px 0 10px 44px}
.defi .d-t{font-size:18px;margin:0 0 14px}
.defi .d-t.sep{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.defi .d-res{font-size:24px;font-weight:500;margin:0 0 6px}
.defi .d-res.ok{color:var(--ok)}
.conseils{margin:0 0 20px}
.conseil{display:grid;grid-template-columns:24px 1fr 20px;gap:14px;align-items:center;width:100%;padding:16px 18px;min-height:60px;border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--surface);margin-bottom:10px;font-size:17px}
.conseil svg{width:22px;height:22px;color:var(--gold)}
.conseil>svg:last-child{color:var(--muted);width:20px;height:20px}
.conseil.ko{border-left-color:var(--alert);background:var(--alert-soft)}
.conseil.ko svg:first-child{color:var(--alert)}
.revue{display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.revue .r-t{display:block;font-size:24px;font-weight:500}
.revue .aide{color:var(--bg);opacity:.8;display:block;margin:4px 0 0}
.revue svg{width:24px;height:24px;color:var(--gold)}

/* Mes opérations */
.verifier{border-color:var(--gold);background:var(--gold-soft)}
.verifier .compte{font-family:var(--sans);font-size:18px;color:var(--muted)}
.question{padding:16px 0;border-top:1px solid var(--line)}
.question .q-t{font-size:18px;font-weight:500;margin:0 0 4px}
.question .q-s{font-size:15px;color:var(--muted);margin:0 0 12px;overflow-wrap:anywhere}
.choix{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.choix-btn{min-height:48px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.choix-btn:hover{border-color:var(--ink)}
.choix-btn.suggere{border-color:var(--gold);background:var(--gold-soft);color:var(--ink);font-weight:500}
.autre{margin-top:6px}
.autre>summary{font-size:16px;color:var(--muted)}
.recherche{width:100%;min-height:52px;padding:10px 16px;font-size:18px;border:1px solid var(--line);background:var(--surface);margin:0 0 20px}
.op{display:flex;flex-direction:column;gap:2px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);min-height:64px}
.op:hover{background:var(--surface)}
.op-l1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.op-m{font-size:18px;font-weight:500;overflow-wrap:anywhere}
.op-amt{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.op-amt.cr,.f-amt.cr,.pv .cr{color:var(--ok)}
.op-l2{font-size:15px;color:var(--muted)}
.op-x{font-size:15px;color:var(--gold)}
.fiche-fond{position:fixed;inset:0;background:rgba(20,19,18,.45);z-index:20}
.fiche{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--bg);border-top:3px solid var(--gold);padding:24px 22px calc(26px + env(safe-area-inset-bottom,0px))}
.fiche .fermer{position:absolute;top:14px;right:14px;width:48px;height:48px;display:grid;place-items:center}
.fiche .fermer svg{width:24px;height:24px}
.f-m{font-size:22px;font-weight:500;margin:0 50px 4px 0;overflow-wrap:anywhere}
.f-amt{font-size:36px;font-weight:300;font-variant-numeric:tabular-nums;margin:0 0 6px}
.f-x{font-size:16px;color:var(--gold);margin:6px 0}
.f-actions{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.extrait{margin:10px 0;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ex-l{margin:0;padding:6px 0 6px 12px;font-size:15px;color:var(--muted);border-left:3px solid transparent;overflow-wrap:anywhere}
.ex-l.cible{color:var(--ink);font-weight:500;border-left-color:var(--gold)}
body.fige{overflow:hidden}

.filtre{margin:0 0 16px;background:var(--p-lavande);border-color:transparent}
.filtre>summary{color:var(--ink)}
.filtre .seg{margin:12px 0}
.filtre .champ{margin:12px 0}
.filtre .grand{width:100%}
.dates{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 20px}
.dates .champ{flex:1;min-width:150px}
.dates input{display:block;width:100%;min-height:52px;font-size:18px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* Importer */
.gros-bouton{display:flex;align-items:center;justify-content:center;gap:14px;min-height:88px;padding:18px;background:var(--ink);color:var(--bg);font-size:21px;font-weight:500;cursor:pointer;text-align:center}
.gros-bouton svg{width:28px;height:28px}
.gros-bouton input{display:none}
.gros-bouton.over{background:var(--gold)}
.releves{margin:0 0 20px}
.releve{padding:16px 18px;border:1px solid var(--line);border-left:4px solid var(--line);background:var(--surface);margin-bottom:10px}
.releve.ok{border-left-color:var(--ok)}.releve.ko{border-left-color:var(--alert)}.releve.essai{border-left-color:var(--gold);border-style:dashed solid dashed solid}
.releve .r-t{margin:0;font-size:18px}
.releve.ok .r-t{color:var(--ink)}
.r-alerte{color:var(--alert);font-size:16px;margin:8px 0 0}
.detail{margin-top:6px}
.detail>summary{font-size:16px;color:var(--muted)}
.verif{font-size:16px;margin:8px 0}.verif.ok{color:var(--ok)}.verif.ko{color:var(--alert)}
.apercu{margin:8px 0}
.pv{display:grid;grid-template-columns:56px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.pv span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.pv span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.pv span:nth-child(2){overflow-wrap:anywhere}
.pv.dup{color:var(--muted)}
.pv em{font-style:normal;font-size:15px;color:var(--muted)}
textarea.anon{width:100%;min-height:160px;font:15px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px;margin:10px 0}

/* Réglages */
.rub-reg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 0;border-bottom:1px solid var(--line);min-height:60px}
.rub-reg>svg{width:22px;height:22px;color:var(--gold)}
.rr-nom{flex:1;min-width:140px;font-size:17px}
.rr-budget{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.rr-budget input{width:96px;min-height:44px;padding:6px 10px;font-size:17px;text-align:right;border:1px solid var(--line);background:var(--bg)}
.compte-reg{padding:10px 0;border-bottom:1px solid var(--line)}
.cr-nom{font-size:18px;font-weight:500;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.ajout{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.regle{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.regle>span:first-child{flex:1;min-width:140px;overflow-wrap:anywhere}
.regle .grand{width:auto;max-width:100%;min-height:44px;font-size:16px}

/* Démarrage */
.demarrage{max-width:520px;margin:6vh auto 0;display:flex;flex-direction:column;gap:6px}
.demarrage h2{font-weight:500;font-size:34px;margin:10px 0 10px}
.demarrage .boutons{flex-direction:column}
.demarrage .boutons .btn{width:100%}
.demarrage>.lien{align-self:center}
.etapes{display:flex;gap:8px;margin:0}
.etapes span{width:28px;height:4px;background:var(--line)}
.etapes span.on{background:var(--gold)}

/* Vide */
.vide{text-align:center;padding:40px 0}
.vide h2{font-weight:500;font-size:28px;margin:0 0 12px}
.vide p{font-size:18px;color:var(--muted);max-width:32ch;margin:0 auto}
.vide .boutons{justify-content:center;margin-top:26px}

/* Année en revue */

const PRO_HINT=/\b(MICRO[- ]?ENTREPRENEUR|MICRO[- ]?ENTREPRISE|AUTO[- ]?ENTREPRENEUR|ENTREPRISE INDIVIDUELLE|COMPTE PROFESSIONNEL|COMPTE PRO|CPTE PRO|CONVENTION PRO|OFFRE PRO|ESPACE PRO)\b/;

function univOf(o,c){
  if(o.src==='rev') return 'pro';
  const k=c&&c!=='_pending'?catById(c):null;
  if(k&&(k.univers==='pro'||k.univers==='perso')) return k.univers;
  const t=acctType(o);
  if(t==='mixte') return o.amount>0&&k&&k.type==='income'?'pro':'perso';

}

function catOf(o){

  if(o.amount>0&&LINK[o.id]){const p=BYID[LINK[o.id]];const c=p&&(p.cat||S.rules[p.merchant+'|-']||S.rules[p.merchant]);if(c)return c}

  if(!r){ const au=S.auto&&(S.auto[dk]||S.auto[o.merchant]); return au&&!(o.amount<0&&typeOf(au.c)==='income')?au.c:null }
  if(o.amount<0&&typeOf(r)==='income') return null;
  return r;
}
const REFUND_RE=/\b(REMBOURSEMENT|REMBT|REMB|RBT|AVOIR|ANNULATION|ANNUL|RETOUR|REFUND)\b/;

const dfmt=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(2,4);
function detectInternal(){
  INTERNAL={};
  const TR=/\b(VIR|VIREMENT|VIRT|TRANSFERT|TRANSFER|VERSEMENT)\b/;
  const cand=S.ops.filter(o=>o.src!=='rev'&&!o.cat&&TR.test(norm(o.label)));
  if(new Set(cand.map(acctOf)).size<2) return;
  const cr=cand.filter(o=>o.amount>0);
  for(const d of cand.filter(o=>o.amount<0)){
    const t=new Date(d.date);
    const m=cr.find(c=>!INTERNAL[c.id]&&acctOf(c)!==acctOf(d)&&Math.abs(c.amount+d.amount)<0.005&&Math.abs(new Date(c.date)-t)<=4*864e5);
    if(m){INTERNAL[d.id]=m.id;INTERNAL[m.id]=d.id}
  }
}
/* Sens d'un virement interne : +1 si c'est une rémunération (pro vers perso), −1 pour un apport (perso vers pro), 0 sinon */
function remuDir(debit,credit){
  const a=acctType(debit), b=acctType(credit);
  if(a==='pro'&&b!=='pro') return 1;
  if(a!=='pro'&&b==='pro') return -1;
  return 0;
}
function relink(){
  detectInternal();
  LINK={};LINKED={};BYID={};BYMONTH={};
  const debits={};
  for(const o of S.ops){BYID[o.id]=o; (BYMONTH[o.date.slice(0,7)]||(BYMONTH[o.date.slice(0,7)]=[])).push(o); if(o.src!=='rev'&&o.amount<0)(debits[o.merchant]||(debits[o.merchant]=[])).push(o)}
  const credits=S.ops.filter(o=>o.src!=='rev'&&o.amount>0&&debits[o.merchant]).sort((a,b)=>a.date<b.date?-1:1);
  for(const r of credits){
    const rc=r.cat||S.rules[r.merchant]; if(rc&&['income','transfer','remu'].includes(typeOf(rc))) continue;
    const rt=new Date(r.date);
    const cand=debits[r.merchant].filter(p=>!LINKED[p.id]&&p.date<=r.date&&(rt-new Date(p.date))<=120*864e5&&-p.amount>=r.amount-0.01);
    if(!cand.length) continue;
    const score=p=>(Math.abs(-p.amount-r.amount)<0.01?0:1000)+(p.awaiting?0:500)+(rt-new Date(p.date))/864e5;
    cand.sort((x,y)=>score(x)-score(y));
    LINK[r.id]=cand[0].id; LINKED[cand[0].id]=r.id;
  }
  /* Remboursements rattachés à un achat d'un autre mois : comptés dans le mois de l'achat */
  REFMOIS={};
  for(const rid in LINK){const r=BYID[rid], p=BYID[LINK[rid]], k=p.date.slice(0,7); if(k!==r.date.slice(0,7))(REFMOIS[k]||(REFMOIS[k]=[])).push(r)}
}
function isRefund(o){
  if(o.amount<=0||o.src==='rev') return false;
  if(LINK[o.id]) return true;
  const c=catOf(o); if(c&&['income','transfer','remu'].includes(typeOf(c))) return false;
  return (c&&c!=='_pending')||REFUND_RE.test(norm(o.label));
}
function waitingReturns(){return S.ops.filter(o=>o.awaiting&&!LINKED[o.id]).sort((a,b)=>a.date<b.date?-1:1)}
function opExtra(o){
  if(INTERNAL[o.id]&&!o.cat){const x=BYID[INTERNAL[o.id]];if(!x)return 'Virement entre vos comptes';
    const [d,c]=o.amount<0?[o,x]:[x,o];const r=remuDir(d,c);
    if(r>0) return o.amount<0?`Votre rémunération, versée sur ${acctName(x.acct)}`:`Votre rémunération, reçue de ${acctName(x.acct)}`;
    if(r<0) return o.amount<0?`Apport vers ${acctName(x.acct)}, votre compte pro`:`Apport reçu de ${acctName(x.acct)}, votre compte perso`;
    return `Virement ${o.amount<0?'vers':'depuis'} ${acctName(x.acct)}, entre vos comptes`}

function norm(s){return s.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function merchantOf(label){
  let s=norm(label);
  if(/\bRETRAITS?\b|\bDAB\b|\bGAB\b/.test(s)) return 'RETRAIT ESPECES';
  const br=BRANDS.find(b=>b[0].test(s)); if(br) return br[1];
  if(/\b(ECH(EANCE)?|REMB(OURSEMENT)?)\s+(DE\s+)?PRET\b/.test(s)){const ln=s.match(/PRET\D*(\d{4,})/);return 'ECHEANCE PRET'+(ln?' '+ln[1].slice(-4):'')}
  s=s.replace(/\b(PAIEMENT PAR CARTE|PAIEMENT CB|PAIEMENT|ACHAT CB|ACHAT|FACTURE CARTE|CARTE X?\d*|CB\*?\d*|PRLV SEPA|PRELEVEMENT SEPA|PRELEVEMENT|PRLV|VIREMENT SEPA|VIREMENT INSTANTANE|VIREMENT|VIR SEPA|VIR INST|VIR|RECU|EMIS|ECHEANCE PRET|ECH PRET|DE|DU|A|VERS|POUR|LE|LA|LES|MR|MME|M)\b/g,' ');
  s=s.replace(/\b(REMBOURSEMENT|REMBT|REMB|RBT|AVOIR|ANNULATION|ANNUL|RETOUR|REFUND|PAYPAL)\b/g,' ');
  const cut=s.search(/\b(MOTIF|REF|REFERENCE|LIBELLE|RUM|ICS|FACTURE|FACT|ECHEANCE|NUM|COMMANDE|CDE)\b/);
  if(cut>0&&/[A-Z]{2}/.test(s.slice(0,cut).replace(/[^A-Z ]/g,''))) s=s.slice(0,cut);
  s=s.replace(/\b(JANVIER|FEVRIER|MARS|AVRIL|MAI|JUIN|JUILLET|AOUT|SEPTEMBRE|OCTOBRE|NOVEMBRE|DECEMBRE|JANV|FEV|AVR|JUIL|SEPT|OCT|NOV|DEC)\b/g,' ');
  s=s.replace(/\d{2}[\/.]\d{2}([\/.]\d{2,4})?/g,' ').replace(/[^A-Z0-9& '.-]/g,' ');
  const stop=new Set(['SA','SAS','SARL','FR','EUR','REF','MOTIF','ID','ICS','RUM','X','COMMERCE','ELECTRONIQUE','WWW','COM','EUROPE','ET','CIE','SCA','SE','LTD','GMBH','PP']);
  const w=s.split(/\s+/).map(x=>x.replace(/^[.'-]+|[.'-]+$/g,'')).filter(x=>x.length>1&&!/\d/.test(x)&&!stop.has(x)&&!/^([A-Z]\.)+[A-Z]?$/.test(x));
  return w.slice(0,3).join(' ')||(/PAYPAL/.test(norm(label))?'PAYPAL':norm(label).trim().slice(0,24))||'INCONNU';
}
/* Mots à chercher sur le web pour un libellé inconnu : le type d'opération, les numéros, les formes de société
   et le code pays collé à la ville sont retirés ; après un intermédiaire de paiement (SumUp, PayPal…), on garde le vrai vendeur. */
const INTERMEDIAIRES=/^(SUMUP|SUM UP|PAYPAL|STRIPE|ZETTLE|IZETTLE|PAYPLUG|LYDIA|SQUARE|SQ|MOLLIE|ADYEN|PAYGREEN|LYF)$/;
const MOTS_TYPE=new Set(['PAIEMENT','PAR','CARTE','CB','WEB','PRLV','PRELEVEMENT','SEPA','VIR','VIREMENT','RECU','EMIS','INST','INSTANTANE','ACHAT','FACTURE','AVOIR','SUR','DE','DU','VERS','EUR','EUROS','SA','SAS','SASU','SARL','EURL','SNC','SCA','LTD','GMBH','BV','SE','SRL','SL','ETS','ET','CIE','DEBIT','DIFFERE','EUROPEEN','COMMERCE','ELECTRONIQUE','MOTIF','REF','RUM','ICS']);
const DEBUT_FR=/^FR(ANC|AIS|EE|ESH|IT|OMAG|UIT|ERE|IGO|ICHE|ONT|AGRA|ED|OID|ANP|ENCH)/;
function motsRecherche(label){
  let s=norm(label||'').replace(/\b\d+[.,]\d+\s*EUR\b.*$/,' ').replace(/\s+/g,' ').trim();
  /* Intermédiaire de paiement : « SUMUP *BOULANGERIE » → « BOULANGERIE » */
  const et=s.split('*'); if(et.length>1){const g=et[0].trim().split(' ');if(INTERMEDIAIRES.test(g[g.length-1]||'')||INTERMEDIAIRES.test(g.slice(-2).join(' ')))s=et.slice(1).join(' ')}
  let w=s.replace(/[*]/g,' ').split(/\s+/).map(x=>x.replace(/^[.,:;'"()-]+|[.,:;'"()-]+$/g,''))
    .filter(x=>x&&!MOTS_TYPE.has(x)&&!INTERMEDIAIRES.test(x)&&x.length>1&&(x.match(/\d/g)||[]).length<2&&!(x.length>=8&&/\d/.test(x))&&!/^\d+$/.test(x));
  if(w.length>1){const d=w[w.length-1],m=d.match(/^(FR|IE|LU|NL|GB)([A-Z]{3,})$/);if(m&&!DEBUT_FR.test(d))w[w.length-1]=m[2]}
  return w.slice(0,6).join(' ');
}

/* Suggestion de rubrique d'après le libellé et le type du compte (perso, pro ou mixte) */
/* {c, sur} : sur=false pour une simple hypothèse (rentrée d'un compte perso sans indice) */
function kwSuggestX(m,label,atype,amount){
  const t=norm(m+' '+label);
  if(amount<0&&CESU_RE.test(t)) return {c:'maison',sur:true};
  if(atype==='pro'&&amount<0&&/\b(VIR|VIREMENT)\b/.test(t)&&/\b(PERSO|PERSONNEL|REMUNERATION|PRELEVEMENT EXPLOITANT)\b/.test(t)) return {c:'remu',sur:true};
  if(/DGFIP|IMPOTS?\b|TRESOR PUBLIC|FINANCES PUBLIQUES|\bCFE\b|\bTVA\b/.test(t)&&atype!=='perso') return {c:'impots',sur:true};
  if(!SAL){for(const [re,c] of KW_PRO) if(re.test(t)) return {c,sur:true};
  if(atype==='pro') for(const [re,c] of KW_PROACC) if(re.test(t)) return {c,sur:true}}
  for(const [re,c] of KW) if(re.test(t)){ if(SAL&&c==='revenus') return amount>0?{c:/SALAIRE|\bPAIE\b/.test(t)?'salaire':'rentrees',sur:true}:null; if(amount<0&&typeOf(c)==='income') return null; return {c,sur:true} }
  if(amount>0&&!REFUND_RE.test(t)) return {c:atype==='perso'?'rentrees':'revenus',sur:false};
  return null;
}
function kwSuggest(m,label,atype,amount){const r=kwSuggestX(m,label,atype,amount);return r?r.c:null}

    return {c,sur:sur.length?new RegExp(sur.map(motif).join('|')):null,prob:prob.length?new RegExp(prob.map(motif).join('|')):null}});

/* Libellé nettoyé : type d'opération, dates, numéros, code pays et ville collée retirés (« PHARM CHAILLOU »).

const FR_MOTS=/^FR(ANC|AIS|EE|ESH|ESC|IT|OMAG|UIT|ERE|IGO|ICHE|ONT|AGRA|ED|OID|ANP|ENCH|AMB|ANK|ANG|OG|ISE|ISB|ONDE|ANT)/;

function libelleNet(label){
  const t=norm(String(label||'')).replace(/\bPAR CARTE(?=[A-Z])/,'PAR CARTE ').replace(/[^A-Z0-9 ]+/g,m=>m.includes('*')||m.includes('.')||m.includes("'")||m.includes('-')?' ':' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  let fin=t.length;
  for(let k=1;k<t.length;k++){const w=t[k]; if(/^FR\d/.test(w)||(/^FR[A-Z]{2,}/.test(w)&&!FR_MOTS.test(w))||/^(IE|NL|LU|DE|GB|ES|IT|BE|US)\d/.test(w)||/^IE[A-Z]{3,}/.test(w)||/^(REF|MOTIF|RUM|ICS)$/.test(w)){fin=k;break}}

}
/* Suggestion du dictionnaire : {c, sur} ou null. Les probables ne sont lues que si aucune entrée sûre ne correspond.
   Un virement n'est comparé qu'aux rubriques qui ont du sens pour lui (un prénom peut ressembler à une enseigne) ;
   une rentrée ne l'est que si c'est un remboursement. */
const DICO_VIR=new Set(['logement','impotsfoyer','epargne','dons','mutuelle','sante']);
function dicoSuggest(label,amount){
  const n=libelleNet(label)||norm(String(label||'')); if(!n) return null;
  const brut=norm(String(label||'')), vir=/^(VIR|VIREMENT)\b/.test(brut.replace(/^(PAIEMENT|PAR|CARTE|WEB)\s+/,''));
  if(amount>0&&!/\b(REMBOURSEMENT|REMBT|REMB|RBT|AVOIR|ANNULATION|ANNUL|RETOUR|REFUND|PREST|PRESTATION)\b/.test(brut)) return null;
  const ok=g=>!vir||DICO_VIR.has(g.c);
  for(const g of DICO_C) if(g.sur&&ok(g)&&g.sur.test(n)) return {c:amount>0&&g.c==='mutuelle'?'sante':g.c,sur:true};
  for(const g of DICO_C) if(g.prob&&ok(g)&&g.prob.test(n)) return {c:g.c,sur:false};

}

async function parsePDF(file){
  if(!window.pdfjsLib) throw new Error(MSG_RESEAU);
  let doc;
  try{doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise}
  catch(e){throw new Error(e&&e.name==='PasswordException'?'Ce relevé est protégé par un mot de passe. Téléchargez-le à nouveau depuis le site de votre banque, sans protection, puis réessayez.':'Ce fichier n’a pas pu être lu. Vérifiez qu’il s’agit bien d’un relevé PDF téléchargé depuis le site de votre banque, puis réessayez.')}
  const lines=[]; let full='';
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const tc=await page.getTextContent();
    const rows=[];
    for(const it of tc.items){
      const s=(it.str||'').trim(); if(!s) continue;
      const x=it.transform[4], y=it.transform[5], w=it.width||0;
      let r=rows.find(r=>Math.abs(r.y-y)<2.5);
      if(!r){r={y,t:[]};rows.push(r)}
      r.t.push({x,w,s});
    }
    rows.sort((a,b)=>b.y-a.y);
    let deb=null,cre=null;
    for(const r of rows){ r.t.sort((a,b)=>a.x-b.x);
      for(const t of r.t){ if(COL_DEB.test(t.s)) deb=t.x+t.w/2; if(COL_CRE.test(t.s)) cre=t.x+t.w/2; } }

  }

  const Y=+(Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]||new Date().getFullYear());
  const header=[]; for(const l of lines){if(dateEnTete(l.tokens,Y)&&l.tokens.some(t=>estMontant(t.s)))break;header.push(l.text)}

    lignes:lines.map(l=>({text:l.text,tokens:l.tokens.map(t=>({x:t.x,w:t.w,s:t.s}))})),Y};
}

/* Contrôle : ancien solde + opérations lues = nouveau solde. null si le relevé n'indique pas les deux soldes. */
function controleSoldes(res){
  const lines=norm(res.full||'').split('\n');
  const fins=lines.filter(l=>SOLDE_FIN.test(l)&&!SOLDE_DEBUT.test(l));
  let d=lines.find(l=>SOLDE_DEBUT.test(l)), f=fins[fins.length-1];

  if(!a||!b) return null;
  const ecart=+(a.solde+res.ops.reduce((s,o)=>s+o.amount,0)-b.solde).toFixed(2);
  const ok=Math.abs(ecart)<0.01;

/* Méthode « lignes » : l'ancienne lecture ligne par ligne */
function lireLignes(lines,Y){

      const amtTok=[...l.tokens].reverse().find(t=>AMT.test(t.s)||t.s.endsWith(amtStr.trim()));
      if(l.deb!=null&&l.cre!=null&&amtTok){const cx=centre(amtTok); col=Math.abs(cx-l.cre)<Math.abs(cx-l.deb)?1:-1}

/* Lecteurs intégrés : banques reconnues, méthode préférée. Ils passent aussi par la vérification des soldes. */
const INTEGRES=[['Crédit Agricole','colonnes'],['BNP Paribas','colonnes'],['Société Générale','colonnes'],['LCL','colonnes'],['Crédit Mutuel','colonnes'],['CIC','colonnes'],
  ['Banque Populaire','colonnes'],['Caisse d’Épargne','colonnes'],['La Banque Postale','colonnes'],['BoursoBank','lignes'],['Qonto','lignes'],['Shine','colonnes']];
/* Carte à débit différé : le relevé détaille les achats carte puis les reprend en une seule ligne
   (« RÈGLEMENT CARTES DÉBIT DIFFÉRÉ »). Si une suite d'achats lus tombe exactement sur ce montant,
   le détail est gardé (plus parlant) et la ligne groupée est écartée, pour ne rien compter deux fois. */
const DIFFERE=/DEBIT DIFFERE|CARTES? (A )?DIFFERE|FACTURE CARTE|RELEVE (DE )?CARTE|REGLEMENT CARTE|ARRETE CARTE|TOTAL CARTE/;
function sansDoubleCarte(ops){
  let out=ops, retire=[];
  for(const g of ops.filter(o=>o.amount<0&&DIFFERE.test(norm(o.label)))){
    const reste=out.filter(o=>o!==g), cible=g.amount; let trouve=false;
    for(let i=0;i<reste.length&&!trouve;i++){let s=0;for(let j=i;j<reste.length;j++){s+=reste[j].amount;if(j>i&&Math.abs(s-cible)<0.005){trouve=true;break}}}
    if(trouve){out=reste;retire.push(g)}

/* Toutes les méthodes sont essayées ; la première dont les soldes tombent juste l'emporte. Sinon, la plus plausible. */
function lireReleve(lines,full,Y){
  const texts=lines.map(l=>l.text), cand=[];
  for(const r of (S.readers||[])){try{
    const det=r.detection?new RegExp(r.detection,'i'):null; if(det&&!det.test(full)) continue;
    const ops=r.type==='colonnes'?lireColonnes(lines,r.cols,Y,{nonSigne:r.nonSigne,libre:1,tol:r.tol}):readWith(compileReader(r),texts,Y);
    if(ops.length) cand.push({ops,methode:'lecteur',reader:r.nom,prio:0})}catch(e){}}
  const bank=detectBank(full), integ=INTEGRES.find(b=>b[0]===bank);
  const ent=colsEntete(lines);
  if(ent) for(const ns of [-1,1]) cand.push({ops:lireColonnes(lines,ent,Y,{nonSigne:ns,suivre:1}),methode:'colonnes',prio:integ&&integ[1]==='colonnes'?1:2});
  cand.push({ops:lireLignes(lines,Y),methode:'lignes',prio:integ&&integ[1]==='lignes'?1:2});
  for(const g of colsGrappes(lines,Y)) cand.push({ops:lireColonnes(lines,g,Y,{nonSigne:g._nonSigne?1:-1}),methode:'grappes',prio:3});
  for(const c of cand){const d=sansDoubleCarte(c.ops);c.ops=d.ops;c.carte=d.retire}
  const valides=cand.filter(c=>c.ops.length);
  for(const c of valides) c.ctl=controleSoldes({full,ops:c.ops});
  const ok=valides.filter(c=>c.ctl&&c.ctl.ok).sort((a,b)=>a.prio-b.prio)[0];
  const best=ok||valides.sort((a,b)=>a.prio-b.prio||b.ops.length-a.ops.length)[0];
  if(!best) return {ops:[],methode:null,verifie:false};
  return {ops:best.ops,methode:best.methode,reader:best.reader||(ok&&integ?integ[0]:''),verifie:!!ok,ctl:best.ctl,carte:best.carte||[]};

const MOIS_N={JANV:1,JAN:1,FEVR:2,FEV:2,MARS:3,MAR:3,AVR:4,MAI:5,JUIN:6,JUIL:7,AOUT:8,SEPT:9,SEP:9,OCT:10,NOV:11,DEC:12};
function parseDateAny(s,Y){
  s=norm(String(s||'')).trim(); let m;
  if(m=s.match(/^(\d{1,2})[\/.\- ](\d{1,2})(?:[\/.\- ](\d{2,4}))?$/)){const y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):Y;return `${y}-${pad(m[2])}-${pad(m[1])}`}
  if(m=s.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/)) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if(m=s.match(/^(\d{1,2})\s+([A-Z]{3,9})\.?(?:\s+(\d{2,4}))?$/)){const k=m[2];const mo=MOIS_N[k]||MOIS_N[k.slice(0,4)]||MOIS_N[k.slice(0,3)];if(!mo)return null;const y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):Y;return `${y}-${pad(mo)}-${pad(m[1])}`}

function compileReader(r){
  if(!r||typeof r!=='object') throw new Error('Le lecteur doit être un objet JSON.');
  if(!r.nom||!r.ligne) throw new Error('Il manque « nom » ou « ligne ».');
  const line=new RegExp(r.ligne,'i'); const det=r.detection?new RegExp(r.detection,'i'):null;
  const g=line.source; if(!/\(\?<date>/.test(g)||!/\(\?<libelle>/.test(g)||!(/\(\?<montant>/.test(g)||/\(\?<debit>/.test(g)||/\(\?<credit>/.test(g))) throw new Error('L’expression « ligne » doit contenir les groupes date, libelle, et montant ou debit/credit.');
  return {r,line,det};
}
function readWith(c,texts,Y){
  const ops=[];
  for(const t of texts){
    const m=c.line.exec(t); if(!m||!m.groups) continue; const G=m.groups;
    const date=parseDateAny(G.date,Y); if(!date) continue;
    let amount=NaN;
    if(G.debit&&G.debit.trim()) amount=-Math.abs(toNum(G.debit));
    else if(G.credit&&G.credit.trim()) amount=Math.abs(toNum(G.credit));
    else if(G.montant){const raw=G.montant.trim();const v=Math.abs(toNum(raw));const neg=/^-|-$/.test(raw), pos=/^\+/.test(raw);

      if(G.sens){amount=/^(C|CR|CREDIT|\+)/i.test(norm(G.sens))?v:-v}}
    if(!isFinite(amount)||!amount) continue;
    const label=String(G.libelle||'').replace(/\s+/g,' ').trim(); if(!label||estHorsOp(label)) continue;
    ops.push({date,label,amount:+amount.toFixed(2)});

}
function applyReaders(texts,full,Y){
  for(const r of (S.readers||[])){
    try{const c=compileReader(r); if(c.det&&!c.det.test(full)) continue; const ops=readWith(c,texts,Y); if(ops.length) return {ops,name:r.nom}}catch(e){}

/* ============ Lecture CSV ============ */
function parseCSV(text){
  const rowsRaw=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!rowsRaw.length) throw new Error('Ce fichier est vide. Téléchargez à nouveau votre relevé depuis le site de votre banque.');
  const sep=(rowsRaw[0].split(';').length>=rowsRaw[0].split(',').length)?';':',';
  const split=l=>{const out=[];let cur='',inq=false;for(const ch of l){if(ch==='"'){inq=!inq;continue}if(ch===sep&&!inq){out.push(cur);cur='';continue}cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  const rows=rowsRaw.map(split);
  let h=rows.findIndex(r=>r.some(c=>/date/i.test(c)));
  if(h<0) throw new Error('Ce fichier ne ressemble pas à un relevé : aucune colonne de dates n’a été trouvée. Téléchargez plutôt le relevé au format PDF depuis le site de votre banque.');
  const H=rows[h].map(c=>norm(c));
  const iD=H.findIndex(c=>c.includes('DATE'));
  const iL=H.findIndex(c=>/LIBELLE|LABEL|DESCRIPTION|INTITULE|OPERATION/.test(c)&&!c.includes('DATE'));
  const iM=H.findIndex(c=>/MONTANT|AMOUNT/.test(c));
  const iDe=H.findIndex(c=>c.includes('DEBIT')), iCr=H.findIndex(c=>c.includes('CREDIT'));
  const ops=[];
  for(const r of rows.slice(h+1)){
    const d=r[iD]||''; let date=null, mm;
    if(mm=d.match(/^(\d{2})[\/.-](\d{2})[\/.-](\d{2,4})/)) date=`${mm[3].length===2?'20'+mm[3]:mm[3]}-${mm[2]}-${mm[1]}`;
    else if(mm=d.match(/^(\d{4})-(\d{2})-(\d{2})/)) date=`${mm[1]}-${mm[2]}-${mm[3]}`;
    if(!date) continue;
    const num=s=>{if(!s)return 0;const t=s.replace(/[€\s\u00a0]/g,'');return parseFloat(t.includes(',')?t.replace(/\./g,'').replace(',','.'):t)||0};
    let amount=iM>=0?num(r[iM]):(num(r[iCr])-Math.abs(num(r[iDe])));
    if(!amount) continue;
    ops.push({date,label:(r[iL>=0?iL:1]||'').replace(/\s+/g,' '),amount:+amount.toFixed(2)});
  }
  return {ops,raw:rowsRaw.slice(0,30).join('\n'),full:rowsRaw.slice(0,h+1).join('\n'),header:rowsRaw.slice(0,h).join('\n')};
}

/* ============ Import ============ */
/* Retrouve le compte d'un relevé (par numéro, sinon par banque) ou en crée un nouveau, avec un type supposé.
   En mode essai (dry), rien n'est créé ni modifié : on renvoie seulement ce qui se passerait. */
function resolveAccount(res,fileName,dry){
  const text=res.full||res.raw||'';
  const bank=detectBank(text)||'', no=detectAccountNo(text);
  let a=no&&S.accounts.find(x=>x.no===no);
  if(!a&&bank){const same=S.accounts.filter(x=>x.bank===bank);
    const free=same.filter(x=>!x.no);
    if(no&&free.length===1){a=free[0];if(!dry){a.no=no;stateDirty=true}}
    else if(!no&&same.length===1) a=same[0];}
  if(!a&&!bank&&!no&&S.accounts.length===1) a=S.accounts[0];
  if(a) return {a,isNew:false,bank,no};
  let name=bank||fileName.replace(/\.[a-z]+$/i,'').replace(/[_-]+/g,' ').trim().slice(0,30)||'Compte principal';
  if(S.accounts.some(x=>x.name===name)) name+=no?' ····'+no.slice(-4):' ('+(S.accounts.filter(x=>x.name.startsWith(name)).length+1)+')';
  const x={name,bank,no,type:IMPTYPE&&!SAL?IMPTYPE:guessType(bank,res.header||text.slice(0,1500),name),confirmed:!!IMPTYPE&&!SAL};
  return {a:dry?x:addAccount(x),isNew:true,bank,no};
}
/* Type choisi avant l'import pour un nouveau compte : 'perso', 'pro', 'mixte' ou null (l'application devine, puis pose la question) */
let IMPTYPE=null;
/* ---------- Rapprochement : une même opération venue du copier-coller et du relevé ---------- */
function similaire(a,b){a=norm(a||'').trim();b=norm(b||'').trim();if(!a||!b)return false;if(a===b||a.includes(b)||b.includes(a))return true;
  const wa=a.split(/\s+/).filter(w=>w.length>=4&&!/^\d+$/.test(w)),wb=new Set(b.split(/\s+/).filter(w=>w.length>=4));return wa.some(w=>wb.has(w))}
/* Même compte, même montant, à 2 jours près : sûr si le marchand se ressemble, douteux sinon. Chaque opération ne sert qu'une fois. */
function jumeau(op,acct,pris,filtre){
  const t=new Date(op.date); let doute=null;
  for(const o of S.ops){ if(pris.has(o.id)||o.src==='rev'||o.acct!==acct||Math.abs(o.amount-op.amount)>0.005||!filtre(o)) continue;
    if(Math.abs(new Date(o.date)-t)>2.5*864e5) continue;
    if(similaire(merchantOf(op.label),o.merchant)||similaire(op.label,o.label)) return {o,sur:true};
    if(!doute) doute=o }
  return doute?{o:doute,sur:false}:null;
}
/* Pour chaque opération lue, retrouve la ligne du relevé d'où elle vient (méthode commune à toutes les lectures) :
   la ligne qui contient le montant, avec le début du libellé sur cette ligne ou juste à côté. */
function lierLignes(res){
  const L=(res.lignes||[]).map(l=>l.text||''); if(!L.length) return;
  const net=t=>norm(t).replace(/\s/g,''), lib=t=>norm(t).replace(/[^A-Z0-9]/g,'');
  const c1=L.map(net), c2=L.map(lib); let ptr=0;
  for(const o of res.ops){
    const frag=lib(o.label).slice(0,8), a=Math.abs(o.amount).toFixed(2).replace('.',',');
    if(frag.length<3) continue;
    const re=new RegExp('(?<![0-9])'+a.replace(',','[,.]')+'(?![0-9])');
    for(let k=0;k<L.length;k++){
      const i=(ptr+k)%L.length;
      if(re.test(c1[i])&&(c2[Math.max(0,i-1)]+c2[i]+(c2[i+1]||'')).includes(frag)){o.lg=i;ptr=i;break}
    }

  const L=(res.lignes||[]).map(l=>l.text||''), m={};

function compteur(){const m=new Map();for(const o of S.ops){const k=cleOp(o);m.set(k,(m.get(k)||0)+1)}return {pris:k=>{const n=m.get(k)||0;if(n>0){m.set(k,n-1);return true}return false}}}

/* ============ Classement automatique après un import ============

   - « sûr »   : une règle de l'utilisateur, une reconnaissance d'office ou une entrée sûre du dictionnaire ;
   - « deviné » : meilleure hypothèse, rangée automatiquement et modifiable d'un geste (mention « classé automatiquement ») ;
   - question  : seulement les marchands qui pèsent le plus, sans réponse fiable, dans la limite de 5.

function sourceAuto(o){

  const a=S.auto[dk]||S.auto[o.merchant]; return a&&catOf(o)?a.q:null;
}
/* Meilleure proposition pour une opération : dictionnaire d'abord, puis les mots-clés déjà connus */
/* Virement vers un de ses propres comptes : « Avec BforBank », ou un IBAN sans aucun nom. Jamais une question : rangé en « Virements entre vos comptes ». */
const VIR_INTERNE=/\bAVEC\s+(?:[A-Z]+\s+)?(?:BANK|BANQUE|BFORBANK|BOURSO\w*|FORTUNEO|HELLO\s*BANK|REVOLUT|N26|QONTO|SHINE)\b|^(?:VIREMENT|VIR)(?:\s+(?:INSTANTANE|SEPA|EMIS|RECU))*\s+FR\d{2}[0-9A-Z ]{10,}\s*\w{0,12}$/;
function propositionPour(o,atype){
  /* Sur un compte pro, le dictionnaire ne range rien d'office, mais ses rubriques perso (loisirs, courses…) valent comme proposition */
  let dic=dicoSuggest(o.label,o.amount);
  if(atype==='pro'){ const c=dic&&catById(dic.c); dic=c&&c.univers==='perso'&&o.amount<0?{c:dic.c,sur:false,pro:true}:null }
  if(dic&&dic.sur) return dic;
  if(atype!=='pro'&&VIR_INTERNE.test(norm(o.label))) return {c:'interne',sur:false};
  const kw=kwSuggestX(o.merchant,o.label,atype,o.amount);
  if(kw&&kw.sur) return kw;

}
/* Range les opérations qui viennent d'être ajoutées. Renvoie {questions, sures, devinees}. */
function classerNouvelles(ops){
  S.auto=S.auto||{};

  for(const o of ops){ if(catOf(o)) continue;
    const k=cleAuto(o), e=g[k]||(g[k]={k,m:o.merchant,ops:[],total:0,at:acctType(o),cred:o.amount>0});
    e.ops.push(o); e.total+=Math.abs(o.amount) }
  const candidats=[]; let sures=0;
  for(const e of Object.values(g)){
    const o=e.ops[0], p=propositionPour(o,e.at);
    if(!silenceOk(e.at,o.amount)){ if(p&&!S.sugg[e.m]) S.sugg[e.m]={c:p.c,src:'kw'}; continue }
    /* Une rentrée n'est rangée sans question que si c'est clairement du perso ou un remboursement */
    if(p&&p.c==='interne'){ S.auto[e.k]={c:'interne',q:'d'}; continue }
    const rentreeSure=!e.cred||['rentrees','retraite','salaire','sante'].includes(p&&p.c)||(p&&p.sur&&typeOf(p.c)!=='income');
    if(p&&p.sur&&rentreeSure){ S.auto[e.k]={c:p.c,q:'s'}; sures++; continue }
    candidats.push({e,p});
  }
  /* Les plus gros marchands sans réponse fiable sont demandés (5 au plus, en comptant ceux qui attendent déjà) */
  const enAttente=new Set(candidats.map(c=>c.e.m));
  const deja=pendingGroups().filter(x=>!enAttente.has(x.m.replace(/\|[+-]$/,''))).length;

/* Marchands rangés par supposition, du plus gros montant au plus petit */

/* Part des dépenses classées, sur une période : {ok, devine, attente} en % des montants */

/* ============ Périodes ============ */

/* Calcul de base d'un mois : un seau par univers (pro, perso) et la rémunération pro → perso.

   le surplus de remboursements est gardé à part (surplus). Trimestres et années = somme des mois. */
function aggRaw(p){
  const ck=p.lvl+p.y+'-'+p.m+(p.lvl==='Q'?Math.ceil(p.m/3):''); if(RAW[ck]) return RAW[ck];

/* Trimestre ou année : somme exacte des mois qui la composent */

/* Vue d'une période pour un univers : 'pro', 'perso' ou 'all' (vue d'ensemble) */

/* Trésorerie des comptes pro : dernier solde connu + opérations postérieures. null si aucun solde n'est connu. */
function tresoPro(){

function mergeCats(saved){

  const out=saved.map(c=>{const d=CATS0.find(k=>k.id===c.id);return {...c,type:c.type||(d?d.type:'expense'),icon:c.icon||(d?d.icon:'tag'),fixed:c.fixed!=null?c.fixed:(d?d.fixed:false)}});
  CATS0.forEach((d,i)=>{if(!out.some(c=>c.id===d.id)){const after=i>0?out.findIndex(c=>c.id===CATS0[i-1].id):-1;out.splice(after+1,0,{...d})}});
  return out;
}
/* Les champs inconnus sont conservés tels quels, puis la migration de schéma s'applique */
let MIGRATED=false;
function merge(x){
  const st={...x,schemaVersion:x.schemaVersion||1,accounts:x.accounts||[],categories:mergeCats(x.categories),rules:x.rules||{},sugg:x.sugg||{},auto:x.auto||{},ops:x.ops||[],incomeSource:x.incomeSource||'bank',settings:{...SET0,...(x.settings||{})},challenges:x.challenges||[],readers:x.readers||[]};
  if(!st.since&&st.ops.length){st.since=Date.now();MIGRATED=true}
  if(!st.masked) st.masked={};
  if(!st.douteux) st.douteux=[];
  if(st.onboarded==null) st.onboarded=st.ops.length>0;
  st.challenges.forEach(c=>{if(!c.key)c.key=newId('d_')});
  if(migrateSchema(st)){MIGRATED=true;st.ops.forEach(o=>dirtyMonths.add(o.date.slice(0,7)))}
  return st;
}
/* Migrations de schéma, dans l'ordre. Chaque étape est rejouable sans risque. */
function migrateSchema(st){
  const v0=st.schemaVersion;
  if(st.schemaVersion<2){
    /* v1 → v2 : le nom de compte porté par chaque opération devient une fiche de compte avec un type */
    const byName={};
    for(const o of st.ops){ if(o.src==='rev') continue;
      const n=o.acct||'Compte principal';
      let a=byName[n];
      if(!a){const bank=(BANKS.find(([b])=>b===n)||[])[0]||detectBank(n)||'';
        a=byName[n]={id:newId('a_'),name:n,bank,no:'',type:guessType(bank,'',n),confirmed:false,solde:null,soldeDate:''};st.accounts.push(a)}
      o.acct=a.id; }
    /* L'ancien type « pro » devient une dépense de l'univers pro */
    st.categories.forEach(c=>{
      if(c.type==='pro'){c.type='expense';c.univers='pro'}
      if(c.id==='pro'&&c.name==='Frais professionnels') c.name='Autres frais professionnels';
      if(!c.univers){const d=CATS0.find(k=>k.id===c.id);c.univers=d?d.univers:(c.type==='income'?'auto':'perso')}
    });
    st.schemaVersion=2;
  }
  if(st.schemaVersion<3){
    /* v2 → v3 : 160 heures par mois par défaut au lieu de 140, sauf si la valeur avait été modifiée */
    if(+st.settings.heures===140) st.settings.heures=160;
    if(!st.settings.netVise) st.settings.netVise=2000;
    st.schemaVersion=3;
  }
  if(st.schemaVersion<4){
    /* v3 → v4 : nouvelles rubriques du foyer, noms plus simples (un nom personnalisé est gardé) */
    for(const c of st.categories){const d=CATS0.find(k=>k.id===c.id);if(d&&OLD_NAMES[c.id]===c.name){c.name=d.name;c.icon=d.icon}}
    st.schemaVersion=4;
  }
  if(st.schemaVersion<5){
    /* v4 → v5 : heures par semaine au lieu de par mois (160 h par mois par défaut devient 40 h par semaine) */
    const h=+st.settings.heures;
    st.settings.heuresSemaine=!h||h===160?40:Math.max(1,Math.round(h*12/52));
    delete st.settings.heures;
    /* Remboursement d'emprunt : rubrique du foyer ; un emprunt payé uniquement depuis un compte pro passe dans la rubrique de l'activité */
    const pret=st.categories.find(c=>c.id==='pret');
    if(pret){if(pret.name==='Remboursement de prêt'){pret.name='Remboursement d’emprunt';pret.icon='banknote'}if(pret.univers==='auto')pret.univers='perso';pret.fixed=true}
    const pro=new Set(st.accounts.filter(a=>a.type==='pro').map(a=>a.id));
    for(const [m,c] of Object.entries(st.rules)) if(c==='pret'){const ops=st.ops.filter(o=>o.merchant===m.replace(/\|[+-]$/,''));if(ops.length&&ops.every(o=>pro.has(o.acct)))st.rules[m]='empruntpro'}
    st.schemaVersion=5;
  }
  if(st.schemaVersion<6){
    /* v5 → v6 : une rubrique par défaut retirée est remplacée par « Conseils et services », sans perte */
    const ids=new Set(CATS0.map(c=>c.id)), retirees=new Set(st.categories.filter(c=>!c.custom&&!ids.has(c.id)&&c.id!=='fraisrembourses'&&!FUSIONS_V13[c.id]).map(c=>c.id));
    if(retirees.size){
      st.categories=st.categories.filter(c=>!retirees.has(c.id));
      for(const m in st.rules) if(retirees.has(st.rules[m])) st.rules[m]='conseils';
      for(const m in st.sugg) if(retirees.has(st.sugg[m].c)) st.sugg[m].c='conseils';
      st.ops.forEach(o=>{if(retirees.has(o.cat))o.cat='conseils'});
    }
    st.schemaVersion=6;
  }
  if(st.schemaVersion<7){
    /* v6 → v7 : plus de frais remboursés par l'activité ; leurs règles et opérations redeviennent ordinaires,
       et un virement du compte pro vers le perso redevient une rémunération. Rubriques renommées. */
    const F='fraisrembourses';
    st.categories=st.categories.filter(c=>c.id!==F);
    for(const m in st.rules) if(st.rules[m]===F) delete st.rules[m];
    for(const m in st.sugg) if(st.sugg[m].c===F) delete st.sugg[m];
    st.ops.forEach(o=>{if(o.cat===F)delete o.cat});
    delete st.virements;
    const ren={transport:['Voiture et transports','Transport & carburant','Transports'],loisirs:['Loisirs','Loisirs & culture','Sorties et loisirs'],voyages:['Voyages','Vacances']};
    for(const [id,noms] of Object.entries(ren)){const c=st.categories.find(k=>k.id===id);if(!c)continue;const nv=noms[noms.length-1];if(noms.includes(c.name))c.name=nv;if(id==='transport')c.univers='perso'}
    st.categories.forEach(c=>{if(c.budgetAn==null)c.budgetAn=0});
    st.schemaVersion=7;
  }
  if(st.schemaVersion<8){
    /* v7 → v8 : budget par mois et budget pour l'année deviennent une seule « limite » par rubrique (par mois, trimestre ou an).
       Les anciens champs sont gardés tels quels. */
    st.categories.forEach(c=>{if(c.limite==null){c.limite=c.budgetAn>0?{montant:+c.budgetAn,per:'Y'}:c.budget>0?{montant:+c.budget,per:'M'}:null}});
    st.schemaVersion=8;
  }
  if(st.schemaVersion<9){
    /* v8 → v9 : rubrique « Conseils et services » retirée ; ses opérations passent dans « Autres frais de l'activité » */
    const X='conseils';
    if(!st.categories.find(c=>c.id===X)?.custom){
      st.categories=st.categories.filter(c=>c.id!==X);
      for(const m in st.rules) if(st.rules[m]===X) st.rules[m]='pro';
      for(const m in st.sugg) if(st.sugg[m].c===X) st.sugg[m].c='pro';
      st.ops.forEach(o=>{if(o.cat===X)o.cat='pro'});
    }
    st.schemaVersion=9;
  }
  if(st.schemaVersion<10){
    /* v9 → v10 : nouvelles rubriques « Épargne et placements » et « Retraite et pensions » (ajoutées d'office).
       Un prélèvement de cotisations sociales rangé dans une rubrique du foyer devient une cotisation déjà payée. */
    const foyer=id=>{const c=st.categories.find(k=>k.id===id);return c&&c.type==='expense'&&c.univers==='perso'};
    const urs=m=>COTIS_RE.test(norm(m.replace(/\|[+-]$/,'')));
    for(const m in st.rules) if(urs(m)&&foyer(st.rules[m])) st.rules[m]='cotisations';
    st.ops.forEach(o=>{if(o.cat&&foyer(o.cat)&&COTIS_RE.test(norm(o.label||''))){o.cat='cotisations';dirtyMonths.add(o.date.slice(0,7))}});
    st.schemaVersion=10;
  }
  if(st.schemaVersion<11){
    /* v10 → v11 : « Vacances » devient « Vacances et séjours » (un nom personnalisé est gardé) */
    const c=st.categories.find(k=>k.id==='voyages'); if(c&&['Vacances','Voyages'].includes(c.name)) c.name='Vacances et séjours';
    st.schemaVersion=11;
  }
  if(st.schemaVersion<12){
    /* v11 → v12 : « Transports » devient « Voiture et déplacements » (un nom personnalisé est gardé) */
    const c=st.categories.find(k=>k.id==='transport'); if(c&&['Transports','Voiture et transports','Transport & carburant'].includes(c.name)) c.name='Voiture et déplacements';
    st.schemaVersion=12;
  }
  if(st.schemaVersion<13){
    /* v12 → v13 : rubriques resserrées. Énergie → Logement, Enfants → Cadeaux, Matériel → Logiciels, Impôts de l'activité → Versements.
       Règles, suggestions, opérations, défis et limites suivent ; « Autres » devient « Espèces et divers ». */
    for(const [de,vers] of Object.entries(FUSIONS_V13)){
      const a=st.categories.find(c=>c.id===de), b=st.categories.find(c=>c.id===vers);
      if(b&&a&&a.limite&&a.limite.montant>0){
        if(!b.limite||!(b.limite.montant>0)) b.limite=a.limite;
        else if(b.limite.per===a.limite.per) b.limite={...b.limite,montant:b.limite.montant+a.limite.montant};
      }
      st.categories=st.categories.filter(c=>c.id!==de);
      for(const m in st.rules) if(st.rules[m]===de) st.rules[m]=vers;
      for(const m in st.sugg) if(st.sugg[m].c===de) st.sugg[m].c=vers;
      st.ops.forEach(o=>{if(o.cat===de){o.cat=vers;dirtyMonths.add(o.date.slice(0,7))}});
      (st.challenges||[]).forEach(c=>{if(c.cat===de)c.cat=vers});
    }
    const ren={logement:['Logement','Logement et énergie'],cadeaux:['Cadeaux','Enfants et cadeaux'],logiciels:['Logiciels et outils','Logiciels et matériel'],divers:['Autres','Espèces et divers']};
    for(const [id,[ancien,nouveau]] of Object.entries(ren)){const c=st.categories.find(k=>k.id===id);if(c&&c.name===ancien)c.name=nouveau}
    st.schemaVersion=13;
  }
  if(st.schemaVersion<14){
    /* v13 → v14 : un prélèvement « CESU » avait été rangé d'office dans les versements de la caisse sociale ; il redevient à classer */
    const cesu=o=>CESU_RE.test(norm(o.label||''));
    const tous=new Map(); st.ops.forEach(o=>{const a=tous.get(o.merchant);tous.set(o.merchant,(a===undefined||a)&&cesu(o))});
    for(const m in st.rules){const mm=m.replace(/\|[+-]$/,'');if(st.rules[m]==='cotisations'&&tous.get(mm)===true)delete st.rules[m]}
    st.ops.forEach(o=>{if(o.cat==='cotisations'&&cesu(o)){delete o.cat;dirtyMonths.add(o.date.slice(0,7))}});
    st.schemaVersion=14;
  }
  if(st.schemaVersion<15){
    /* v14 → v15 : « Versements de ce qui est mis de côté » devient « Charges sociales » (un nom personnalisé est gardé) ; les rubriques nouvelles sont ajoutées à la lecture */
    const c=st.categories.find(k=>k.id==='cotisations'); if(c&&c.name==='Versements de ce qui est mis de côté') c.name='Charges sociales';
    st.schemaVersion=15;
  }
  if(st.schemaVersion<16){
    /* v15 → v16 : « Enfants et cadeaux » redevient « Cadeaux » (un nom personnalisé est gardé) */
    const c=st.categories.find(k=>k.id==='cadeaux'); if(c&&c.name==='Enfants et cadeaux') c.name='Cadeaux';
    st.schemaVersion=16;
  }
  return st.schemaVersion!==v0;
}

/* Enregistrement immédiat quand la page est quittée ou mise en arrière-plan, pour ne rien perdre */
function saveNow(){if(!demo&&timer){clearTimeout(timer);timer=null;saveLocal();if(mode==='db')flush()}}

async function flush(){
  if(demo) return;
  saveLocal();
  if(mode!=='db'){setStatus('local');return}
  if(flushing){again=true;return}
  flushing=true; setStatus('saving');
  const months=[...dirtyMonths]; dirtyMonths.clear(); const st=stateDirty; stateDirty=false;
  try{
    if(st){const {ops,...etat}=S;await db.doc(base()).set({...JSON.parse(JSON.stringify(etat)),updated:Date.now()})}
    for(const mk of months){
      const ref=db.doc(base()).collection('months').doc(mk);
      const ops=S.ops.filter(o=>o.date.slice(0,7)===mk);
      if(ops.length) await ref.set({ops}); else await ref.delete();
    }
    setStatus('saved');
  }catch(e){ stateDirty=true; months.forEach(m=>dirtyMonths.add(m)); setStatus(e&&e.code==='quota_exceeded'?'quota':'error'); }
  flushing=false; if(again){again=false;flush()}
}
function setStatus(s){
  saveState=s||saveState;
  const t={saving:'Enregistrement…',saved:'Enregistré',local:'Vos données sont gardées sur cet appareil uniquement',error:'Échec de l’enregistrement, nouvel essai à la prochaine modification',quota:'Espace de stockage plein'}[saveState]||'';
  $('#status').textContent=demo?'Exemple, rien n’est enregistré':t;
  majSauvegardeEntete();
}
function migrate(){
  let ch=false; const old=new Set();
  for(const o of S.ops){ if(o.src==='rev') continue;
    const nm=merchantOf(o.label);
    if(nm!==o.merchant){ if(S.rules[o.merchant]&&!S.rules[nm]&&!brandOf(o.label)&&!autoCatOf(o.label,acctType(o),o.amount)) S.rules[nm]=S.rules[o.merchant];
      old.add(o.merchant); o.merchant=nm; dirtyMonths.add(o.date.slice(0,7)); ch=true }
    if(appliqueAuto(o,acctType(o))) ch=true;
  }
  const live=new Set(S.ops.map(o=>o.merchant));
  old.forEach(m=>{if(!live.has(m)){delete S.rules[m];delete S.sugg[m]}});
  if(ch) stateDirty=true;
  return ch;
}
async function initStore(){
  loadUI();
  const local=loadLocal(); let localMig=false; if(local){MIGRATED=false;S=merge(local);localMig=migrate()||MIGRATED}
  render();
  try{
    if(!HAS_CLAUDE){setStatus('local');if(localMig)save();return}
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=u?await u.id():null;
    if(d&&id){
      db=d; uid=id; mode='db';
      const st=await db.doc(base()).get();
      if(st.exists){
        const data=JSON.parse(JSON.stringify(st.data()));
        const ms=await db.doc(base()).collection('months').get();
        const ops=[]; ms.docs.forEach(x=>ops.push(...JSON.parse(JSON.stringify(x.data().ops||[]))));
        MIGRATED=false; S=merge({...data,ops}); S.ops.sort((a,b)=>a.date<b.date?1:-1); if(migrate()||MIGRATED){stateDirty=true;save()}
        if(!demo){P=null;render()}
        saveLocal(); setStatus('saved');
      } else if(S.ops.length||Object.keys(S.rules).length){
        S.ops.forEach(o=>dirtyMonths.add(o.date.slice(0,7))); save();
      } else setStatus('saved');
      return;
    }
  }catch(e){}
  mode='local'; setStatus('local'); if(localMig) save();
}

function pendingGroups(){
  const g={}, sens={};
  /* Un marchand qui a à la fois des dépenses et des rentrées (achats et remboursements, ventes…) : deux questions séparées */
  for(const o of S.ops){ if(catOf(o)) continue; sens[o.merchant]=(sens[o.merchant]||0)|(o.amount>0?2:1) }
  for(const o of S.ops){ if(catOf(o)) continue;
    const key=S.rules[o.merchant]||sens[o.merchant]===3?o.merchant+(o.amount>0?'|+':'|-'):o.merchant;
    const e=g[key]||(g[key]={m:key,n:0,total:0,label:o.label,refunds:0,accts:[],ops:[],credit:o.amount>0});
    e.ops.push(o);
    if(o.amount>0&&(LINK[o.id]||REFUND_RE.test(norm(o.label)))) e.refunds++;
    e.accts.push(o.acct); e.n++; e.total+=o.amount; }
  return Object.values(g).sort((a,b)=>b.n-a.n||Math.abs(b.total)-Math.abs(a.total));
}

function choixRubriques(x){
  const s=S.sugg[x.m.replace(/\|[+-]$/,'')]?.c, acc=[...new Set(x.accts.map(id=>(acctById(id)||{}).type||'perso'))];

/* Questions : une carte à la fois, la suggestion en premier ; puis ce qui a été rangé par supposition */

function carteQuestion(x){

function aVerifier(){
  const g=pendingGroups(), dv=douteuxValides(), n=g.length+dv.length, dev=devinees();
  if(n===0) WIZ={total:0,later:false}; else WIZ.total=Math.max(WIZ.total,n);

    if(WIZ.later) h+=`<section class="carte verifier"><p class="phrase">${n} question${n>1?'s':''} en attente.</p><button class="btn" data-act="wizresume">Reprendre</button></section>`;
    else {
      const fait=WIZ.total-n+1;
      h+=`<section class="carte verifier"><div class="wiz-tete"><h3>À vérifier <span class="compte">(${n})</span></h3><button class="lien" data-act="wizlater">Terminer plus tard</button></div>

        <div class="choix gros"><button class="choix-btn" data-dout="${i}:1">Oui, c’est la même : n’en garder qu’une</button><button class="choix-btn" data-dout="${i}:0">Non, ce sont deux opérations</button></div></div>`}).join('')
      :g.slice(0,1).map(x=>x.credit&&x.accts.some(id=>acctById(id)?.type==='mixte')?`<div class="question client-q"><p class="q-t">${esc(ruleName(x.m).replace(/ \((dépenses|rentrées)\)$/,''))}</p>
        <p class="q-s">${x.n>1?`${x.n} rentrées, ${eur(x.total)} au total`:`Rentrée de ${eur(x.total)}`}. ${esc(x.label)}</p>

      ${avecSug>1?`<button class="btn secondaire" data-act="validall">Tout valider (${avecSug} suggestion${avecSug>1?'s':''})</button>`:''}</section>`;
    }
  }
  if(dev.length){

    h+=`<details class="carte repli devinees"${DEV_OUVERT?' open':''}><summary>Classé automatiquement : ${dev.length} marchand${dev.length>1?'s':''}, ${eur0(tot)}</summary>

    ${dev.slice(0,40).map(d=>`<div class="ligne-grp"><p class="lg-t"><span>${esc(ruleName(d.k).replace(/ \((dépenses|rentrées)\)$/,''))}</span> <b class="${d.total>0?'cr':''}">${d.total>0?'+':'−'}${eur(Math.abs(d.total))}</b></p>
      <select class="grand" data-devsel="${esc(d.k)}" aria-label="Rubrique de ${esc(d.k)}">${catOptions(d.c,false,'',false)}</select>${lienRecherche(d.label)}</div>`).join('')}
    <button class="btn" data-act="valdev">Tout valider</button></details>`;
  }
  return h;
}
let HEURES=null, RELEVE=false;
/* Ce qui est écrit sur le relevé autour de l'opération (3 lignes avant, 3 après), à la demande */
function blocReleve(o){

/* Sous un encaissement de l'activité : son équivalent en heures au prix minimum, et le temps réellement passé */
function heuresBloc(o,statique){
  const px=heuresPrix(); if(!px||!estEncaissementPro(o)) return '';
  const eq=Math.round(o.amount/px);
  let h=`<span class="h-eq">= environ ${nb(eq)} h de travail à votre prix</span>`;
  if(o.heures>0){const t=o.amount/o.heures;h+=`<span class="h-reel ${t<px?'rouge':'or'}">Vous avez passé ${fmt1(o.heures)} h : ce travail vous a rapporté ${eur0(t)} de l’heure</span>`}
  if(statique) return `<div class="op-heures">${h}</div>`;
  if(HEURES===o.id) h+=`<span class="heures-saisie"><label class="champ">Heures réellement passées<input id="heuresIn" type="number" inputmode="decimal" min="0" step="0.5" value="${o.heures||''}"></label><button class="btn secondaire" data-heuresok="${o.id}">Enregistrer</button></span>`;

function opLine(o,statique){

/* Somme de ce qui a été trouvé : dépensé, reçu, et le net si les deux existent. Les virements entre vos comptes ne comptent pas. */
function totalRecherche(list){
  const l=list.filter(o=>!(INTERNAL[o.id]&&!o.cat)); if(!l.length) return '';
  const dep=l.filter(o=>o.amount<0).reduce((s,o)=>s-o.amount,0), rec=l.filter(o=>o.amount>0).reduce((s,o)=>s+o.amount,0), net=rec-dep;

/* Filtre de Mes opérations : période (mois, trimestre, année, dates précises) et rubrique */
let FIL={lvl:'M',cat:'',du:'',au:''};
const filActif=()=>FIL.cat!==''||FIL.lvl!=='M';
function filBornes(){
  if(FIL.lvl==='D'){
    const ds=S.ops.map(o=>o.date).sort(), min=ds[0]||'', max=ds[ds.length-1]||'';
    let du=FIL.du||min, au=FIL.au||max;
    if(du>au) [du,au]=[au,du];
    return [du,au];
  }
  const [a,b]=bounds({...P,lvl:FIL.lvl}); return [a+'-01',b+'-31'];
}
function opsFiltrees(){

  else{
    const [du,au]=filBornes();
    l=du?monthKeys(du.slice(0,7),au.slice(0,7)).flatMap(k=>BYMONTH[k]||[]).filter(o=>o.date>=du&&o.date<=au):[];
  }

function filtreRubrique(l){

function vOps(){

/* ============ Importer ============ */
function reportLine(r){
  const last=r.lus.reduce((m,o)=>o.date>m?o.date:m,''), mois=last?MOIS[+last.slice(5,7)-1]+(last.slice(0,4)!==thisMonth().slice(0,4)?' '+last.slice(0,4):''):'';
  const qui=esc(r.bank||(r.acctInfo&&r.acctInfo.name)||r.name);
  let txt,cls='';
  if(r.error){txt=`${esc(r.name)} : ${esc(r.error)}`;cls='ko'}
  else if(!r.found){txt=`${esc(r.name)} : aucune opération n’a été reconnue.`;cls='ko'}
  else if(r.test) txt=`${qui}, ${mois} : ${r.found} opération${r.found>1?'s':''} lue${r.found>1?'s':''}. C’est un essai, rien n’a été enregistré.`;
  else if(r.colle) {txt=`Copier-coller${r.bank?', '+esc(r.bank):''} : ${r.added} opération${r.added>1?'s':''} ajoutée${r.added>1?'s':''} ✓${r.dups?`, ${r.dups} déjà présente${r.dups>1?'s':''}`:''}${r.douteux?`, ${r.douteux} à confirmer dans Mes opérations`:''}.`;cls='ok'}
  else if(r.completees) {txt=`${qui}, ${mois} : ${r.found} opérations. ${r.completees} étaient déjà là grâce à votre copier-coller et ont été complétées, ${r.added} ajoutée${r.added>1?'s':''} ✓${r.douteux?` (${r.douteux} à confirmer dans Mes opérations)`:''}`;cls='ok'}
  else if(!r.added) txt=r.detail?`${qui}, ${mois} : déjà importé, rien n’a été ajouté. Le détail du relevé est maintenant disponible pour ${r.detail} opération${r.detail>1?'s':''} ✓`:`${qui}, ${mois} : déjà importé, rien n’a été ajouté.`;
  else {txt=`${qui}, ${mois} : ${r.added} opération${r.added>1?'s':''} ajoutée${r.added>1?'s':''} ✓`;cls='ok'}

function dateCollee(s){

const RE_MONT=/[-+]?\s?(?:\d{1,3}(?:[ .  ]\d{3})+|\d{1,7})[,.]\d{2}(?:\s?(?:€|EUR))?/g;

function parseCollage(txt,signeDefaut){

  const out=[], def=signeDefaut==='ren'?1:-1;

  if(lignes.filter(l=>l.includes('\t')).length>=Math.max(1,lignes.length/2)){
    const rows=lignes.map(l=>l.split('\t').map(c=>c.trim()));
    const h=rows.findIndex(r=>r.some(c=>/date/i.test(c))&&r.some(c=>/d[ée]bit|cr[ée]dit|montant/i.test(c)));
    const H=h>=0?rows[h].map(c=>norm(c)):[], iD=H.findIndex(c=>/DEBIT/.test(c)), iC=H.findIndex(c=>/CREDIT/.test(c));
    for(const r of rows.slice(h+1)){

      const txtc=r.filter((c,i)=>i!==di&&!RE_MONT.test(c)&&(RE_MONT.lastIndex=0,true)&&!dateCollee(c)); RE_MONT.lastIndex=0;
      const label=txtc.sort((a,b)=>b.length-a.length)[0]||'';

    const premier=x=>{RE_MONT.lastIndex=0;const r=x.match(RE_MONT);RE_MONT.lastIndex=0;return r&&r[0]};

function calculAssistant(r){

  if(!autres.length) cols={date:tD.x,lib:tL.x,mont:dep,...(autres.length?{solde:autres[autres.length-1]}:{})};

  }

/* ============ Fichier de revenus ============ */
let revDraft=null, revError='', revMsg='';

  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/)) return `${m[3].length===2?'20'+m[3]:m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function toAmt(c){

}
function csvRows(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  const sep=(lines[0].split(';').length>=lines[0].split(',').length)?';':',';
  return lines.map(l=>{const out=[];let cur='',inq=false;for(const ch of l){if(ch==='"'){inq=!inq;continue}if(ch===sep&&!inq){out.push(cur);cur='';continue}cur+=ch}out.push(cur);return out.map(s=>s.trim())});
}
function bestCol(body,test){let best=-1,bn=0;const w=Math.max(0,...body.map(r=>r.length));for(let i=0;i<w;i++){const n=body.filter(r=>test(r[i])).length;if(n>bn){bn=n;best=i}}return best}

    if(r.some(c=>/DATE/.test(c))&&r.some(c=>/MONTANT|TOTAL|TTC|\bHT\b|NET|ENCAISS|SOMME|PRIX|CHIFFRE|\bCA\b/.test(c))){h=i;break}}
  const H=(rows[h]||[]).map(c=>norm(cellStr(c)));
  const find=(res,noDate)=>{for(const re of res){const i=H.findIndex(c=>re.test(c)&&!(noDate&&/DATE/.test(c)));if(i>=0)return i}return -1};
  d.h=h;

  d.amt=find([/ENCAISS/,/\bNET\b/,/TTC/,/\bHT\b/,/MONTANT|TOTAL|SOMME|PRIX|CHIFFRE|\bCA\b/],true);
  d.lab=find([/CLIENT/,/LIBELLE|DESCRIPTION|OBJET|INTITULE|PRESTATION|DESIGNATION/],true);

function endOf(p){const [,b]=bounds(p);return {y:+b.slice(0,4),m:+b.slice(5,7)}}
function monthsTo(y,m,n){const out=[];for(let i=n-1;i>=0;i--){const q=shift({lvl:'M',y,m},-i);out.push({lvl:'M',y:q.y,m:q.m})}return out}
/* Statistiques sur 12 mois. Les revenus lissés suivent l'univers affiché ; les dépenses moyennes (matelas) couvrent tout, pro et perso. */
function stats(p,U){
  U=U||UNIV;
  const e=endOf(p); const ms=monthsTo(e.y,e.m,12).map(q=>({q,a:agg(q,U),t:agg(q,'all')}));
  const wd=ms.filter(x=>x.t.any), n=wd.length||1;
  const lisse=wd.reduce((s,x)=>s+x.a.income,0)/n;
  const l3=wd.slice(-3), l6=wd.slice(-6);
  const pointMort=l3.reduce((s,x)=>s+x.a.fixed,0)/(l3.length||1);
  const depMoy=l6.reduce((s,x)=>s+x.t.net,0)/(l6.length||1);
  const ep=+S.settings.epargne||0;
  return {ms,lisse,pointMort,depMoy,nData:wd.length,autonomie:ep>0&&depMoy>0?ep/depMoy:null,autoEss:ep>0&&pointMort>0?ep/pointMort:null};
}
function recurring(){
  const last=lastOpDate(); if(!last) return [];
  const end={y:+last.slice(0,4),m:+last.slice(5,7)}; const ms=monthsTo(end.y,end.m,6).map(q=>q.y+'-'+pad2(q.m));
  const g={};
  for(const k of ms) for(const o of (BYMONTH[k]||[])){ if(o.amount>=0||o.src==='rev'||!inUniv(o)) continue;
    const c=catOf(o); if(!c||['income','transfer','remu'].includes(typeOf(c))||['pret','courses','resto','transport','shopping'].includes(c)) continue;
    const e=g[o.merchant]||(g[o.merchant]={m:o.merchant,c,by:{},amts:[]}); e.by[k]=(e.by[k]||0)+1; e.amts.push(-o.amount); }
  const out=[];
  for(const e of Object.values(g)){
    const months=Object.keys(e.by); if(months.length<3) continue;
    if(Math.max(...Object.values(e.by))>1) continue;
    const mean=e.amts.reduce((s,x)=>s+x,0)/e.amts.length, sd=Math.sqrt(e.amts.reduce((s,x)=>s+(x-mean)**2,0)/e.amts.length);
    if(sd/mean>.2) continue;
    const first=months.sort()[0]; const span=ms.length-ms.indexOf(first);
    const monthly=e.amts.reduce((s,x)=>s+x,0)/span;
    out.push({m:e.m,c:e.c,monthly,annual:monthly*12});
  }
  return out.sort((a,b)=>b.annual-a.annual);
}
/* ============ Taux horaire et revenu net visé ============ */
const hSemaine=()=>+S.settings.heuresSemaine||SET0.heuresSemaine;
/* Heures par mois : heures par semaine × 52 ÷ 12 */
const heures=()=>hSemaine()*52/12;
const netVise=()=>+S.settings.netVise||SET0.netVise;
const tauxCible=()=>netVise()/heures();
/* Revenu net et taux horaire réel : sur la période affichée (moyenne par mois) et lissés sur 12 mois */
function activite(p){
  const H=heures(), V=netVise(), A=agg(p,'pro');
  const net=A.revenuNet/A.months;
  const e=endOf(p); const ms=monthsTo(e.y,e.m,12).map(q=>({q,a:agg(q,'pro')})).filter(x=>x.a.any);
  const lisse=ms.length?ms.reduce((s,x)=>s+x.a.revenuNet,0)/ms.length:null;
  return {H,V,cible:V/H,net,taux:net/H,manque:Math.max(0,V-net),ok:net>=V,any:A.any&&(A.ca>0||A.frais>0),
    lisse,tauxLisse:lisse!=null?lisse/H:null,nLisse:ms.length,A};
}
/* Mois affiché encore incomplet : le dernier relevé s'arrête avant la fin du mois */
function moisPartiel(p){
  if(p.lvl!=='M') return null;
  const k=p.y+'-'+pad(p.m), last=(BYMONTH[k]||[]).reduce((m,o)=>o.date>m?o.date:m,'');
  const dim=new Date(p.y,p.m,0).getDate();
  return last&&+last.slice(8,10)<dim-3&&lastOpDate().slice(0,7)===k?+last.slice(8,10):null;
}

/* ============ Vrai salaire net de l'heure et juste prix ============ */
const reglage=(k,min,max)=>{const v=S.settings[k];const n=v===''||v==null||isNaN(+v)?SET0[k]:+v;return Math.min(max,Math.max(min,n))};
const semTrav=()=>52-reglage('semNonTrav',0,51);
const epRet=()=>reglage('epRetraite',0,90)/100;
const nonFact=()=>reglage('nonFacture',0,90)/100;
const hJour=()=>reglage('hJour',1,24);
/* Cascade : ce qui reste en poche par heure → moins les congés → moins l'épargne et la retraite */
function calcSalaire(pocheMois,heuresMois,corrConges,epargne){
  const brut=pocheMois/heuresMois, conges=brut*corrConges, vrai=conges*(1-epargne);
  return {brut,conges,vrai};
}
/* Correction des congés : les mois et trimestres ne contiennent pas les congés de l'année ;
   une année dont les 12 mois ont des relevés les contient déjà. */
function correctionConges(p){
  if(p.lvl==='Y'){let n=0;for(let m=1;m<=12;m++)if((BYMONTH[p.y+'-'+pad(m)]||[]).some(o=>o.src!=='rev'))n++;if(n===12)return 1}
  return semTrav()/52;
}
/* Vrai salaire sur une période : null si l'activité n'a rien laissé en poche */
function vraiSalaire(p){
  const A=agg(p,'pro'); if(!A.any) return {vide:true};
  const poche=A.revenuNet/A.months;
  if(!(A.ca>0)||poche<=0) return {rien:true,poche};
  const corr=correctionConges(p), c=calcSalaire(poche,heures(),corr,epRet());
  return {...c,poche,corr,cible:tauxCible(),ok:c.vrai>=tauxCible()-1e-9,manque:Math.max(0,tauxCible()-c.vrai),congesInclus:corr===1};
}
/* Prix minimum à facturer, selon le mode de calcul de la somme mise de côté */
function calcPrix({vise,epargne,fraisAn,taux,assiette,semaines,hSem,nonFacture,hParJour}){
  if(epargne>=1||taux>=1||nonFacture>=1) return null;
  const poche=vise*12/(1-epargne);
  const enc=assiette==='resultat'?poche/(1-taux)+fraisAn:(poche+fraisAn)/(1-taux);
  const hFact=semaines*hSem*(1-nonFacture); if(hFact<=0) return null;
  const heure=enc/hFact;
  return {poche,enc,hFact,heure,jour:heure*hParJour};
}
/* Moyennes réelles des 12 derniers mois qui ont des données d'activité */
function douzeMois(){
  const last=lastOpDate(); if(!last) return [];
  return monthsTo(+last.slice(0,4),+last.slice(5,7),12).map(q=>agg(q,'pro')).filter(a=>a.any);
}
function justePrix(){
  const ms=douzeMois(), fraisAn=ms.length?ms.reduce((s,a)=>s+a.fraisExpl,0)/ms.length*12:0;
  const r=calcPrix({vise:netVise(),epargne:epRet(),fraisAn,taux:reglage('taux',0,90)/100,assiette:S.settings.assiette,semaines:semTrav(),hSem:hSemaine(),nonFacture:nonFact(),hParJour:hJour()});
  if(!r) return null;
  const caAn=ms.length>=3?ms.reduce((s,a)=>s+a.ca,0)/ms.length*12:null;
  return {...r,fraisAn,moyen:caAn!=null&&caAn>0?caAn/r.hFact:null,nMois:ms.length};
}

/* Cascade complète, par heure : de ce que paient les clients jusqu'au vrai salaire net */
function cascade(p){
  const A=agg(p,'pro'); if(!A.any) return null;
  const mo=A.months, enc=A.ca/mo, frais=A.fraisExpl/mo, prov=A.provision/mo, H=heures(), nf=nonFact();
  if(!(enc>0)||enc-frais-prov<=0) return {rien:true};
  const hFact=H*(1-nf), corr=correctionConges(p), ep=epRet(), poche=enc-frais-prov;
  const a=enc/hFact, b=enc/H, c=(enc-frais)/H, d=poche/H, e=d*corr, f=e*(1-ep);
  return {a,b,c,d,e,f,enc,frais,prov,poche,H,hFact,corr,ep,nf,congesInclus:corr===1};
}

/* Sous l'état de l'enregistrement : quand la dernière sauvegarde a eu lieu, et le bouton pour la mettre dans un dossier Cloud */

/* Chrome et Edge sur ordinateur : on choisit directement le dossier (Google Drive, iCloud, Dropbox…). Ailleurs, le fichier est téléchargé. */
async function sauvegardeCloud(){
  const data=JSON.stringify({app:SAL?'mon-compte':'mes-comptes',version:1,date:new Date().toISOString(),data:S});
  const name=`${SAL?'mon-compte':'mes-comptes'}-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  if(window.showSaveFilePicker){
    try{
      const h=await showSaveFilePicker({suggestedName:name,types:[{description:'Sauvegarde',accept:{'application/json':['.json']}}]});
      const w=await h.createWritable(); await w.write(data); await w.close();
      S.lastBackup=Date.now(); save(); backupMsg='Sauvegarde enregistrée dans le dossier choisi ✓'; majSauvegardeEntete(); alert(backupMsg); if(view==='reglages') render(); return;
    }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  await backup_();
  alert('Sauvegarde téléchargée. Déposez maintenant ce fichier dans votre dossier Cloud (Google Drive, iCloud, Dropbox…).');
}
async function backup_(){
  const data=JSON.stringify({app:SAL?'mon-compte':'mes-comptes',version:1,date:new Date().toISOString(),data:S});
  const name=`${SAL?'mon-compte':'mes-comptes'}-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  try{
    const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data});S.lastBackup=Date.now();save();backupMsg='Sauvegarde enregistrée.';render();return}
  }catch(e){backupMsg='Sauvegarde annulée.';render();return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  S.lastBackup=Date.now();save();backupMsg='Sauvegarde téléchargée. Gardez ce fichier en lieu sûr.';majSauvegardeEntete();render();
}
/* Restaurer : la confirmation est dans la page (certains écrans, dont l’aperçu en ligne, masquent les fenêtres du navigateur) */
let RESTAURER=null;
async function restore_(file){
  try{
    const j=JSON.parse(await file.text());
    if(j.app!==(SAL?'mon-compte':'mes-comptes')||!j.data) throw 0;
    if(S.ops.length&&!demo){RESTAURER=j;backupMsg='';render();return}
    appliquerRestauration(j);
  }catch(e){backupMsg='Ce fichier n’est pas une sauvegarde de '+(SAL?'Mon compte':'Mes comptes')+'.';render()}
}
function appliquerRestauration(j){
  RESTAURER=null;

  S.ops.forEach(o=>dirtyMonths.add(o.date.slice(0,7)));
  S=merge(j.data); S.ops.forEach(o=>dirtyMonths.add(o.date.slice(0,7)));
  backupMsg=`Sauvegarde du ${new Date(j.date).toLocaleDateString('fr-FR')} restaurée.`; P=null; save(); render();
}
